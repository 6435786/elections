<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניתוח הבחירות 2022–2026</title>
<style>
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-latin.woff2) format("woff2")}
:root{--bg:#f7f6f2;--card:#fff;--line:#e4e2d9;--line2:#d5d2c7;--ink:#2a2722;--ink2:#6e685e;--ink3:#9a9488;--acc:#136f73;--acc-soft:#e6f0f0;
 --y22:#8db8b9;--y24:#4f9597;--y26:#136f73;--gain:#00919a;--loss:#c0673a;--track:#f1efe9;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line2);margin-bottom:22px}
.brand{font-weight:800;font-size:16px}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--ink3)}
.tabs{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);background:#fff;overflow:hidden}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:7px 16px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.tabs button+button{border-inline-start:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff}
.tools{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-size:13.5px;padding:6px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
details.tierbox{position:relative}
details.tierbox summary{list-style:none;cursor:pointer}
details.tierbox summary::-webkit-details-marker{display:none}
details.tierbox .pop{position:absolute;inset-inline-end:0;top:38px;z-index:1000;width:290px;background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
details.tierbox label{display:flex;gap:8px;align-items:center;padding:3px 0}
.warn{color:#b4452f;font-size:12.5px}
h1{font-size:28px;font-weight:800;line-height:1.2;margin:0}
.kick{font-size:13px;color:var(--ink3);margin-bottom:2px}
.lede{color:var(--ink2);margin:6px 0 20px;font-size:14.5px}
.lede b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin:0 0 16px}
.card>h2{font-size:19px;font-weight:700;margin:0 0 2px}
.card>.sub,.sub2{font-size:13.5px;color:var(--ink2);margin:0 0 14px}
.card h3{font-size:15px;font-weight:700;margin:0 0 2px}
.note{font-size:12.5px;color:var(--ink3);margin:12px 0 0;line-height:1.5}
.pts{margin:0;padding:0;list-style:none}
.pts li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.pts li:last-child{border-bottom:0}
.pts li>b:first-child{min-width:170px;flex-shrink:0;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 24px}
.cb-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.dl{font-size:14px;color:var(--ink);font-weight:600;white-space:nowrap}
.dl small{font-weight:400;color:var(--ink3)}
.ar{font-style:normal;font-size:10px;margin-inline-end:3px;vertical-align:1px}
.ar.up{color:var(--gain)} .ar.dn{color:var(--loss)}
.yr{display:grid;grid-template-columns:44px 1fr 96px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.yr>span{color:var(--ink3);font-size:12.5px}
.yr>b{font-weight:700;text-align:left;font-variant-numeric:tabular-nums}
.yr>b small{font-weight:400;color:var(--ink3);font-size:11.5px}
.tr{position:relative;height:12px;background:var(--track);border-radius:2px}
.tr i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-start-end-radius:3px;border-end-end-radius:3px}
.y22{background:var(--y22)} .y24{background:var(--y24)} .y26{background:var(--y26)}
.tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);margin-inline-start:-1px}
.mk{font-size:12px;color:var(--ink2);margin:5px 52px 0 0;display:flex;gap:6px;align-items:flex-start}
.mk u{display:inline-block;flex-shrink:0;width:2px;height:13px;background:var(--ink);margin-top:2px}
.foot{font-size:12px;color:var(--ink3);margin:4px 52px 0 0}
.big{font-size:30px;font-weight:800;line-height:1.15}
.big small{font-size:14px;font-weight:500;color:var(--ink2)}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .l{font-size:13px;color:var(--ink2)}
.sgp{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sgp .meta{font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.sgp .cb+.cb{margin-top:14px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:0 0 10px}
.leg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-size:13.5px;color:var(--acc);font-weight:600}
.rt{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr 84px 84px 118px;font-size:14px}
.rt>div{padding:10px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.rt .h{font-size:12.5px;color:var(--ink3);padding-top:0;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.rt .nm{font-weight:700}
.rt small{font-weight:400;font-size:12px;color:var(--ink3)}
.rt .v,.rt .c,.rt .h.n{text-align:left;font-variant-numeric:tabular-nums}
.rt .bars .tr{height:9px;margin:2px 0}
.rt .last{border-bottom:0}
.dvr{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.dvr .nm{font-weight:600}
.dvr .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.dv{display:grid;grid-template-columns:1fr 1fr;height:14px}
.dv>div{position:relative}
.dv>div:first-child{border-inline-end:1px solid var(--ink3)}
.dv i{position:absolute;top:1px;bottom:1px}
.dv .neg i{inset-inline-end:0;background:var(--loss);border-start-start-radius:3px;border-end-start-radius:3px}
.dv .pos i{inset-inline-start:0;background:var(--gain);border-start-end-radius:3px;border-end-end-radius:3px}
.dv.mute .pos i,.dv.mute .neg i{background:#b8b3a7}
.dvr .val{text-align:left;font-variant-numeric:tabular-nums;font-weight:700}
.dvr .val small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.dvr.sep{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;color:var(--ink2)}
.hyp{background:var(--acc-soft);border-radius:6px;padding:10px 12px;margin-top:12px;font-size:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:12px;font-weight:600;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
th:first-child,td:first-child{text-align:right;position:sticky;inset-inline-start:0;background:#fff;z-index:1}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-weight:600;white-space:normal;min-width:110px}
td small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
td .hc{display:inline-block;min-width:54px;padding:1px 6px;border-radius:4px}
tr.dim td{color:var(--ink3)}
tr.pl{cursor:pointer} tr.pl:hover td{background:#faf9f5}
tr.det td{background:#fbfaf6;white-space:normal;text-align:right;position:static}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 18px}
.pick input,.inp{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;width:210px;max-width:100%;background:#fff}
.chip{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.msg{border:1px solid #e3cdb8;background:#fbf4ec;border-radius:var(--r);padding:12px 14px;font-size:14px;margin:0 0 14px;line-height:1.9}
.empty{color:var(--ink2);padding:16px 2px}
#map{height:60vh;min-height:360px;border-radius:var(--r);border:1px solid var(--line);background:#ece9e1;margin-bottom:8px}
.leaflet-container{font-family:inherit;font-size:13px}
.leaflet-popup-content{margin:10px 12px;direction:rtl;text-align:right;line-height:1.5;min-width:200px}
.leaflet-popup-content .pp{margin-top:6px} .leaflet-popup-content .pb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap} .leaflet-popup-content .pb .btn{font-size:13px;padding:4px 10px}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.mapbar select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:#fff}
.ml{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.ml i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:4px;vertical-align:-1px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;margin-inline-start:6px;background:#eeebe3;color:var(--ink2)}
@media (max-width:700px){
 .wrap{padding:0 14px 60px} h1{font-size:23px} .big{font-size:25px}
 .g2,.g3{grid-template-columns:1fr} .card{padding:14px 13px}
 .tabs{order:3;width:100%} .tabs button{flex:1;padding:8px 6px}
 details.tierbox{position:static} details.tierbox .pop{position:absolute;left:14px;right:14px;top:auto;margin-top:6px;width:auto}
 .pts li{display:block} .pts li>b:first-child{display:block;min-width:0}
 .rt{grid-template-columns:1fr 1fr 1fr}
 .rt .h{display:none}
 .rt>div{border-bottom:0;padding:3px 4px}
 .rt .nm{grid-column:1/-1;padding-top:12px;border-top:1px solid var(--line)}
 .rt .nm.first{border-top:0}
 .rt .bars{grid-column:1/-1}
 .rt .v,.rt .c{text-align:right}
 .rt .v::before,.rt .c::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3)}
 .dvr{grid-template-columns:96px 1fr 72px;gap:6px;font-size:13px}
 .yr{grid-template-columns:38px 1fr 86px}
 .mk,.foot{margin-right:46px}
}
@media print{
 html,body{background:#fff;font-size:12.5px} .noprint,#map,.mapbar,.ml{display:none!important}
 .card{break-inside:avoid} .wrap{max-width:none;padding:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact} .tw{overflow:visible} @page{margin:12mm}
}

<body>
<div class="wrap"><div id="app"><p class="empty">טוען נתונים…</p></div></div>
<script>
'use strict';
const CERT='ודאי',NEAR='כמעט ודאי',GUESS='השערה',NONE='ללא שיוך'; const TIERS=[CERT,NEAR,GUESS,NONE];
const CONC=['1309','70','2033','440','766','2610','3780','6100','6200','3730','4000','6700','3000','3797','1061','7400','3660','7900','8000','2630','8400','3815','3779'];
const HC=['6100','3797','3780','1309','3660','922','1137'];
const QUICK=['3000','6100','2610','3797','3780','70','1309','922','3660','1137','2560'];
const TH=0.6;
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=v=>v!=null&&!isNaN(v)&&isFinite(v);
const fmt=n=>ok(n)?Math.round(n).toLocaleString('he-IL'):'—';
const pc=(v,d)=>{ if(!ok(v)) return '—'; if(d==null) d=Math.abs(v)<0.01?2:1; return (v*100).toFixed(d)+'%'; };
const LRM='‎';
const sgn=(d,dd=1)=>ok(d)?LRM+(d>=0?'+':'−')+Math.abs(d).toFixed(dd):'—';
const sgi=n=>ok(n)?LRM+(n>=0?'+':'−')+fmt(Math.abs(n)):'—';
const ptsN=d=>ok(d)?Math.abs(d*100).toFixed(Math.abs(d*100)<1?2:1):'—';
const pts=d=>ok(d)?LRM+(d>=0?'+':'−')+ptsN(d)+' נק׳':'—';
const rel=(a,b)=>(ok(a)&&ok(b)&&b>0)?(a-b)/b*100:null;
const div=(a,b)=>(a!=null&&b)?a/b:null;
const lv=(v,ls)=>(ls||[]).reduce((a,l)=>a+(v[l]||0),0);
const bv=(b,ks)=>ks.reduce((a,k)=>a+(b[k]||0),0);
const arr=d=>!ok(d)||d===0?'':d>0?'<i class="ar up">▲</i>':'<i class="ar dn">▼</i>';
const updn=(d,u,w)=>d>=0?u:w;
async function fetchJSON(u,tries=2){ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),40000); try{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }catch(e){ if(tries>1){ await new Promise(r=>setTimeout(r,800)); return fetchJSON(u,tries-1); } throw e; }finally{ clearTimeout(tm); } }
let ROWS=[],CITIES={},LOC={},POLY=[],DRAW=false,MAP=null,POLYL=null,FIND='',OPEN=new Set();
let PTS={},MEM={},KEYROW={},MARKS=[],PICK=null,PICKL=null,GRPL=null; // מקומות קלפי בכתובת שלהם; PICK = מקומות שנבחרו מהחלונית
let S=(()=>{ try{ return JSON.parse(localStorage.getItem('k26.k3'))||{}; }catch(e){ return {}; } })();
S.tab=S.tab||'nat'; S.city=S.city||'3780'; S.tiers=S.tiers||{[CERT]:true,[NEAR]:true,[GUESS]:true,[NONE]:true}; S.metric=S.metric||'utj';
const save=()=>{ try{ localStorage.setItem('k26.k3',JSON.stringify(S)); }catch(e){} };
const inTier=r=>!!S.tiers[r.tier];
const allOn=()=>TIERS.every(t=>S.tiers[t]);
const getLoc=async c=>LOC[c]||(LOC[c]=await fetchJSON('live/loc/'+c+'.json'));

/* ---------- סיכום ---------- */
function agg(rows){ const A={y26:{n:0,e:0,v:0,k:0,votes:{}},y22:{n:0,e:0,v:0,k:0,votes:{}},m:{n:0,e:0,v:0,k:0,b:{}},rows:0};
  rows.forEach(r=>{ if(!inTier(r)) return; A.rows++;
    for(const y of ['y26','y22']){ const a=A[y],s=r[y]; a.n+=s.n; a.e+=s.e; a.v+=s.v; a.k+=s.k; for(const l in s.votes) a.votes[l]=(a.votes[l]||0)+s.votes[l]; }
    if(r.m&&S.tiers[r.m_tier||NONE]){ const a=A.m; a.n+=r.m.n; a.e+=r.m.e; a.v+=r.m.v; a.k+=r.m.k; for(const k in r.m.b) a.b[k]=(a.b[k]||0)+r.m.b[k]; } });
  return A; }
function withTiers(list,fn){ const keep=S.tiers; S.tiers={[CERT]:false,[NEAR]:false,[GUESS]:false,[NONE]:false}; list.forEach(t=>S.tiers[t]=true); try{ return fn(); }finally{ S.tiers=keep; } }
const RP=[
 {id:'utj',t:'יהדות התורה',k:['ג'],k22:['ג']},
 {id:'shas',t:'ש"ס',k:['שס'],k22:['שס']},
 {id:'right',t:'עוצמה יהודית + הציונות הדתית',k:['ב','ט'],k22:['ט'],n22:'ב-2022 רשימה אחת',parts:[['ב','עוצמה'],['ט','הציונות הדתית']]},
 {id:'likud',t:'הליכוד',k:['מחל'],k22:['מחל']},
 {id:'ner',t:'צבע שחור',k:['נר'],k22:null},
 {id:'zach',t:'הציבור החרדי',k:['זך'],k22:null}];

/* ---------- רכיבים גרפיים ---------- */
// פסי שנים: list=[{y,v,c,lbl,seg}] ; השינוי מהראשון לאחרון
function yb(title,list,f,o={}){ const vals=list.map(x=>x.v).filter(ok); const mx=Math.max(...vals,o.mark||0,0)*1.04||1; const w=v=>ok(v)?Math.max(0,Math.min(100,v/mx*100)).toFixed(2):0;
  const a=list[0].v,b=list[list.length-1].v, d=(ok(a)&&ok(b))?b-a:null;
  let h=`<div class="cb"><div class="cb-h"><span>${title}</span>${d!=null?`<span class="dl">${arr(d)}${o.df?o.df(d,a,b):f(d)}</span>`:''}</div>`;
  list.forEach((x,i)=>{ let bar;
    if(x.seg){ let acc=0; bar=x.seg.map(s=>{ const st=w(acc); acc+=s.v; return `<i class="${x.c}" style="inset-inline-start:${st}%;width:calc(${w(s.v)}% - 2px);${s.op?'opacity:'+s.op:''}" title="${esc(s.t)}: ${esc(f(s.v))}"></i>`; }).join(''); }
    else bar=ok(x.v)?`<i class="${x.c}" style="width:${w(x.v)}%" title="${esc(x.y)}: ${esc(f(x.v))}"></i>`:'';
    h+=`<div class="yr"><span>${esc(x.y)}</span><div class="tr">${bar}${o.mark&&i===list.length-1?`<u style="inset-inline-start:${w(o.mark)}%"></u>`:''}</div><b>${ok(x.v)?f(x.v):'—'}</b></div>`; });
  if(o.mark) h+=`<div class="mk"><u></u><span>${o.markLbl}</span></div>`;
  if(o.foot) h+=`<div class="foot">${o.foot}</div>`;
  return h+'</div>'; }
const dvVotes=(d,a,b)=>`${sgi(d)} <small>(${sgn(rel(b,a))}%)</small>`;
const dvPct=d=>pts(d);
function legend(ys){ const L={2022:['y22','2022'],2024:['y24','2024 (מוניציפלי)'],2026:['y26','2026']}; return `<div class="leg">${ys.map(y=>`<span><i class="${L[y][0]}"></i>${L[y][1]}</span>`).join('')}</div>`; }

/* ---------- מעוזים ---------- */
const CITYBOTH={};
function cityBoth(c){ if(c in CITYBOTH) return CITYBOTH[c]; let d=0,a=0; ROWS.forEach(r=>{ if(r.code===c&&r.m){ d+=r.m.b.dagel||0; a+=r.m.b.aguda||0; } }); return CITYBOTH[c]=d>0&&a>0; }
const dshare=r=>{ const d=r.m.b.dagel||0,a=r.m.b.aguda||0; return d/(d+a); };
function sgCompute(rows){ const G={dagel:[],aguda:[],mixed:[]};
  rows.forEach(r=>{ if(r.kind!=='place'||!inTier(r)||!r.m||!r.y26.e||!r.y22.e||!r.m.e) return; const b=r.m.b; if((b.utj||0)>0||(b.joint||0)>0) return; if(!cityBoth(r.code)) return; if((b.dagel||0)+(b.aguda||0)<100) return; const s=dshare(r); (s>=TH?G.dagel:s<=1-TH?G.aguda:G.mixed).push(r); });
  return G; }
function sgAgg(l){ const a={n:l.length,e26:0,e22:0,e24:0,g22:0,g26:0,d:0,a:0,rows:l}; l.forEach(r=>{ a.e26+=r.y26.e; a.e22+=r.y22.e; a.e24+=r.m.e; a.g22+=r.y22.votes['ג']||0; a.g26+=r.y26.votes['ג']||0; a.d+=r.m.b.dagel||0; a.a+=r.m.b.aguda||0; });
  a.p22=div(a.g22,a.e22); a.p26=div(a.g26,a.e26); a.p24=div(a.d+a.a,a.e24); a.r22=rel(a.p26,a.p22); return a; }

const sumB=bs=>{ const s={n:0,e:0,v:0,k:0,votes:{}}; bs.forEach(b=>{ s.n++; s.e+=b.e; s.v+=b.v; s.k+=b.k; for(const l in b.votes) s.votes[l]=(s.votes[l]||0)+b.votes[l]; }); return s; };
const keyName=k=>k.slice(k.indexOf('|')+1);
function popHtml(mk,own){ const r=mk.r,p=(x,l)=>div(lv(x.votes,l),x.e),others=mk.grp?MEM[mk.i].filter(k=>k!==mk.k):[];
  let h=`<b>${esc(r.city)} · ${esc(mk.name)}</b><br>${esc(mk.addr||'')}${mk.nb?' · '+esc(mk.nb):''}`;
  if(mk.grp&&own) h+=`<div class="pp"><b>המקום הזה ב-2026:</b> בעלי זכות ${fmt(own.y26.e)} · יהדות התורה ${pc(p(own.y26,['ג']))} · ש"ס ${pc(p(own.y26,['שס']))}</div>`;
  h+=`<div class="pp">${mk.grp?`<b>הקבוצה (${MEM[mk.i].length} מקומות):</b> `:''}בעלי זכות ${fmt(r.y26.e)} · הצבעה ${pc(div(r.y26.v,r.y26.e))}<br>יהדות התורה ${pc(p(r.y26,['ג']))} (2022: ${pc(p(r.y22,['ג']))})<br>ש"ס ${pc(p(r.y26,['שס']))} (2022: ${pc(p(r.y22,['שס']))})${r.m?`<br>2024: דגל ${fmt(r.m.b.dagel||0)}, אגודה ${fmt(r.m.b.aguda||0)}, ש"ס ${fmt(r.m.b.shas||0)}, עץ ${fmt(r.m.b.peleg||0)}`:''}<br><span style="color:#9a9488">ודאות: ${esc(r.tier)}</span></div>`;
  if(others.length) h+=`<div class="pp">משויך ל: ${others.map(k=>{ const a=(PTS[r.code][keyName(k)]||[])[2]; return esc(keyName(k))+(a?' ('+esc(a)+')':''); }).join(' · ')}</div>`;
  return h+`<div class="pb"><button class="btn" data-a="pick" data-k="${esc(mk.k)}">בחר</button>${others.length?`<button class="btn" data-a="pickgrp" data-i="${mk.i}">בחר עם הקבוצה</button>`:''}</div>`; }
// מקומות שנבחרו → שורות לסיכום: קבוצה שנבחרה כולה נשארת כמו שהיא; מקום שנבחר בלי שאר הקבוצה נספר לבד
async function selRows(keys){ const by=new Map(); keys.forEach(k=>{ const i=KEYROW[k]; if(i==null) return; if(!by.has(i)) by.set(i,[]); by.get(i).push(k); });
  const rows=[],part=[],seen=new Set();
  for(const [i,ks] of by){ const r=ROWS[i]; if(r.kind!=='place'||ks.length>=(MEM[i]||[]).length){ rows.push(r); continue; }
    const loc=await getLoc(r.code);
    for(const k of ks){ const n=keyName(k),pl=loc.places.find(x=>x.name===n); if(!pl) continue; const k22=r.code+'|'+(pl.name22||''),dup=!!pl.name22&&seen.has(k22); if(pl.name22) seen.add(k22); const pt=PTS[r.code][n];
      const pr={...r,names26:[n],names22:pl.name22&&!dup?[pl.name22]:[],y26:sumB(pl.boxes26),y22:dup?sumB([]):sumB(pl.boxes22),boxes26:pl.boxes26.map(b=>b.box),boxes22:dup?[]:pl.boxes22.map(b=>b.box),m:null,n_places:1,addr:pt[2],nbhd:pt[3]||'',lat:pt[0],lon:pt[1]};
      rows.push(pr); part.push({n,p22:pr.names22[0]||'',rest:MEM[i].filter(x=>!ks.includes(x)).map(keyName)}); } }
  return {rows,part}; }
const METRICS=[['utj','יהדות התורה: שינוי מ-2022'],['shas','ש"ס: שינוי מ-2022'],['right','עוצמה + צ"ד: שינוי מ-2022'],['putj','יהדות התורה 2026'],['ner','צבע שחור 2026'],['dg','דגל או אגודה (2024)']];
function metricVal(r){ const p=(y,l)=>div(lv(r[y].votes,l),r[y].e); switch(S.metric){ case 'utj': return (p('y26',['ג'])-p('y22',['ג']))*100; case 'shas': return (p('y26',['שס'])-p('y22',['שס']))*100; case 'right': return (p('y26',['ב','ט'])-p('y22',['ט']))*100; case 'putj': return p('y26',['ג'])*100; case 'ner': return p('y26',['נר'])*100; case 'dg': return r.m&&((r.m.b.dagel||0)+(r.m.b.aguda||0))>=30?dshare(r)*100:null; } return null; }
function mcolor(v){ if(!ok(v)) return '#c9c4b8'; if(['utj','shas','right'].includes(S.metric)){ const t=Math.max(-1,Math.min(1,v/8)); return t>=0?`rgba(0,145,154,${(.2+.8*t).toFixed(2)})`:`rgba(192,103,58,${(.2+.8*-t).toFixed(2)})`; } if(S.metric==='dg'){ const t=(v-50)/50; return t>=0?`rgba(19,111,115,${(.2+.8*t).toFixed(2)})`:`rgba(181,121,26,${(.2+.8*-t).toFixed(2)})`; } const mx=S.metric==='ner'?4:70; return `rgba(19,111,115,${(.12+.88*Math.min(1,v/mx)).toFixed(2)})`; }
function mapLegend(){ const m=S.metric; if(['utj','shas','right'].includes(m)) return '<span><i style="background:rgb(192,103,58)"></i>ירידה</span><span><i style="background:rgb(0,145,154)"></i>עלייה</span><span>צבע מלא: 8 נקודות ומעלה</span>'; if(m==='dg') return '<span><i style="background:rgb(181,121,26)"></i>אגודה</span><span><i style="background:rgb(19,111,115)"></i>דגל</span>'; return '<span><i style="background:rgba(19,111,115,.3)"></i>נמוך</span><span><i style="background:rgb(19,111,115)"></i>גבוה</span>'; }
function inPoly(p,q){ let c=false; for(let i=0,j=q.length-1;i<q.length;j=i++){ const [yi,xi]=q[i],[yj,xj]=q[j]; if(((yi>p[0])!==(yj>p[0]))&&(p[1]<(xj-xi)*(p[0]-yi)/(yj-yi)+xi)) c=!c; } return c; }
function mapView(){ return `<div class="kick">מפה</div><h1>סימון שטח</h1><p class="lede">מסמנים שטח על המפה ומקבלים עליו סיכום כמו של עיר.</p><div class="mapbar noprint"><select data-c="metric">${METRICS.map(([v,t])=>`<option value="${v}" ${S.metric===v?'selected':''}>${t}</option>`).join('')}</select><button class="btn ${DRAW?'on':''}" data-a="draw">${DRAW?'מסמן: לחץ על המפה, ובסיום לחץ כאן':'סמן שטח'}</button><button class="btn" data-a="clearpoly" ${POLY.length||PICK?'':'disabled'}>נקה</button><input class="inp" type="text" id="jump" list="locs" placeholder="קפיצה ליישוב" style="width:170px"><datalist id="locs">${citiesOpts()}</datalist></div><div class="ml">${mapLegend()}<span><i style="background:#c9c4b8"></i>אין נתון</span><span>גודל הנקודה: בעלי זכות בחירה</span></div><div id="map"></div><div id="mapres" style="margin-top:18px"></div>`; }
function mountMap(){ try{ if(MAP){ const rr=MAP._renderer; if(rr&&rr._redrawRequest){ L.Util.cancelAnimFrame(rr._redrawRequest); rr._redrawRequest=null; } MAP.remove(); } }catch(e){} POLYL=null; PICKL=null; GRPL=null;
  MAP=L.map('map',{preferCanvas:true}); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP); const v=S.mapView; if(v) MAP.setView([v.lat,v.lng],v.z); else MAP.setView([31.75,34.95],8);
  MARKS=mapMarks(); const mx=Math.max(1,...MARKS.map(m=>m.e));
  MARKS.forEach(mk=>{ const r=mk.r,m=L.circleMarker([mk.lat,mk.lon],{radius:2.5+10*Math.sqrt(mk.e/mx),color:'#2a2722',weight:.4,fillColor:mcolor(metricVal(r)),fillOpacity:1}).addTo(MAP);
    m.bindPopup(()=>popHtml(mk));
    m.on('popupopen',async()=>{ if(DRAW){ m.closePopup(); return; } if(GRPL){ MAP.removeLayer(GRPL); GRPL=null; }
      if(mk.grp){ const ll=MEM[mk.i].map(k=>PTS[r.code][keyName(k)]).map(p=>[p[0],p[1]]); GRPL=L.polyline(ll,{color:'#2a2722',weight:1.5,dashArray:'4 4'}).addTo(MAP);
        try{ const loc=await getLoc(r.code),pl=loc.places.find(x=>x.name===mk.name); if(pl&&m.isPopupOpen()) m.setPopupContent(popHtml(mk,{y26:sumB(pl.boxes26)})); }catch(e){} } });
    m.on('popupclose',()=>{ if(GRPL){ MAP.removeLayer(GRPL); GRPL=null; } }); });
  const keep=()=>{ const c=MAP.getCenter(); S.mapView={lat:+c.lat.toFixed(5),lng:+c.lng.toFixed(5),z:MAP.getZoom()}; save(); }; MAP.on('moveend zoomend',keep);
  MAP.on('click',e=>{ if(!DRAW) return; POLY.push([e.latlng.lat,e.latlng.lng]); drawPoly(); drawRes(); }); $('#map').style.cursor=DRAW?'crosshair':''; drawPoly(); }
function drawPoly(){ if(POLYL){ MAP.removeLayer(POLYL); POLYL=null; } if(POLY.length) POLYL=(POLY.length>=3?L.polygon(POLY,{color:'#2a2722',weight:2,fillOpacity:.06}):L.polyline(POLY,{color:'#2a2722',weight:2,dashArray:'4 4'})).addTo(MAP);
  if(PICKL){ MAP.removeLayer(PICKL); PICKL=null; } if(PICK) PICKL=L.layerGroup(MARKS.filter(m=>PICK.includes(m.k)).map(m=>L.circleMarker([m.lat,m.lon],{radius:15,color:'#2a2722',weight:2.5,fill:false,interactive:false}))).addTo(MAP);
  const c=document.querySelector('[data-a="clearpoly"]'); if(c) c.disabled=!POLY.length&&!PICK; }
async function drawRes(){ const el=$('#mapres'); if(!el) return; let keys;
  if(PICK) keys=new Set(PICK);
  else { if(POLY.length<3||DRAW){ el.innerHTML=`<p class="empty">${POLY.length>=3?'ממשיך לסמן. בסיום לחץ על הכפתור למעלה.':'לחץ "סמן שטח", לחץ על המפה סביב האזור, ובסיום לחץ שוב על הכפתור. אפשר גם ללחוץ על מקום קלפי ואז על "בחר".'}</p>`; return; }
    keys=new Set(MARKS.filter(m=>inPoly([m.lat,m.lon],POLY)).map(m=>m.k)); }
  if(!keys.size){ el.innerHTML='<p class="empty">אין מקומות קלפי בשטח המסומן.</p>'; return; }
  const {rows:sel,part}=await selRows(keys); if(!sel.length){ el.innerHTML='<p class="empty">אין נתונים למקומות שנבחרו.</p>'; return; }
  const codes=[...new Set(sel.map(r=>r.code))], one=PICK&&keys.size===1;
  const pn=part.length?`<div class="note" style="margin:0 0 14px">${part.map(x=>`<b>${esc(x.n)}</b> נספר לבד, בלי שאר הקבוצה שלו (משויך ל: ${x.rest.map(esc).join(' · ')}). ${x.p22?`ההשוואה ל-2022 היא רק למקום המקביל שלו, ${esc(x.p22)}`:'אין לו מקום מקביל משלו ב-2022'}, ואין לו נתוני 2024.`).join('<br>')} כדי לספור את הקבוצה כולה, סמן שטח שכולל את כל המקומות שלה או לחץ "בחר עם הקבוצה".</div>`:'';
  el.innerHTML=`<div class="kick">${keys.size} ${keys.size===1?'מקום קלפי':'מקומות קלפי'} · ${codes.length===1?esc(sel[0].city):codes.length+' ערים ויישובים'}</div><h1 style="font-size:22px">${one?esc(sel[0].names26[0]||rowName(sel[0])):PICK?'המקומות שנבחרו':'השטח המסומן'}</h1>`+pn+await areaReport(sel,{}); }

/* ---------- מסגרת ---------- */
function topBar(){ return `<header class="top noprint"><div class="brand">ניתוח הבחירות<small>כנסת 2022 ו-2026, מוניציפלי 2024</small></div><nav class="tabs">${[['nat','כל הארץ'],['city','לפי עיר'],['map','מפה']].map(([v,l])=>`<button data-tab="${v}" class="${S.tab===v?'on':''}">${l}</button>`).join('')}</nav><div class="tools"><details class="tierbox"><summary class="btn">ודאות: ${allOn()?'הכל':TIERS.filter(t=>S.tiers[t]).length+' מתוך 4'}</summary><div class="pop"><div style="color:var(--ink2);margin-bottom:6px">אילו חיבורים בין מקומות הקלפי בשנים השונות לכלול:</div>${TIERS.map(t=>`<label><input type="checkbox" data-tier="${t}" ${S.tiers[t]?'checked':''}> ${t}</label>`).join('')}${allOn()?'':'<div class="warn" style="margin-top:6px">הסכומים אינם הנתון הרשמי המלא.</div>'}</div></details>${S.tab==='map'?'':'<button class="btn" data-a="print">שמירה כ-PDF</button>'}</div></header>`; }
function readHash(){ const m=/^#(nat|city|map)(?:\/(\d+))?/.exec(location.hash||''); if(!m) return; S.tab=m[1]; if(m[2]&&CITIES[m[2]]) S.city=m[2]; }
function writeHash(){ const h='#'+S.tab+(S.tab==='city'?'/'+S.city:''); if(location.hash!==h) history.replaceState(null,'',h); }
async function render(){ writeHash(); const app=$('#app'); let h=topBar();
  if(S.tab==='nat') h+=natView(); else if(S.tab==='city') h+=await cityView(); else h+=mapView();
  app.innerHTML=h; if(S.tab==='map'){ mountMap(); await drawRes(); } }

/* ---------- אירועים ---------- */
const goCity=c=>{ S.tab='city'; S.city=c; OPEN.clear(); FIND=''; save(); render().then(()=>window.scrollTo(0,0)); };
document.addEventListener('click',async ev=>{ const t=ev.target;
  const tb=document.querySelector('details.tierbox[open]'); if(tb&&!tb.contains(t)) tb.open=false;
  const tab=t.closest('[data-tab]'); if(tab){ S.tab=tab.dataset.tab; OPEN.clear(); FIND=''; save(); return render(); }
  const ci=t.closest('[data-city]'); if(ci) return goCity(ci.dataset.city);
  const go=t.closest('[data-goto]'); if(go) return goCity(go.dataset.goto);
  const op=t.closest('tr[data-open]'); if(op){ const k=op.dataset.open; OPEN.has(k)?OPEN.delete(k):OPEN.add(k); const y=window.scrollY; await render(); window.scrollTo(0,y); return; }
  const a=t.closest('[data-a]'); if(!a) return; const act=a.dataset.a;
  if(act==='print'){ const ds=[...document.querySelectorAll('details.more')]; const was=ds.map(d=>d.open); ds.forEach(d=>d.open=true); const tt=document.title; document.title='ניתוח בחירות - '+($('h1')?.innerText||''); window.print(); document.title=tt; ds.forEach((d,i)=>d.open=was[i]); return; }
  if(act==='pick'||act==='pickgrp'){ PICK=act==='pick'?[a.dataset.k]:(MEM[+a.dataset.i]||[]).slice(); POLY=[]; DRAW=false; if(MAP) MAP.closePopup(); const d=document.querySelector('[data-a="draw"]'); if(d){ d.classList.remove('on'); d.textContent='סמן שטח'; } $('#map').style.cursor=''; drawPoly(); await drawRes(); $('#mapres').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(act==='draw'){ DRAW=!DRAW; if(DRAW&&PICK) PICK=null; if(!DRAW&&POLY.length<3) POLY=[]; a.classList.toggle('on',DRAW); a.textContent=DRAW?'מסמן: לחץ על המפה, ובסיום לחץ כאן':'סמן שטח'; $('#map').style.cursor=DRAW?'crosshair':''; drawPoly(); return drawRes(); }
  if(act==='clearpoly'){ POLY=[]; PICK=null; DRAW=false; const d=document.querySelector('[data-a="draw"]'); if(d){ d.classList.remove('on'); d.textContent='סמן שטח'; } $('#map').style.cursor=''; drawPoly(); return drawRes(); } });
document.addEventListener('change',ev=>{ const t=ev.target;
  if(t.dataset.tier){ S.tiers[t.dataset.tier]=t.checked; save(); return render().then(()=>{ const d=document.querySelector('details.tierbox'); if(d) d.open=true; }); }
  if(t.dataset.c==='metric'){ S.metric=t.value; save(); return render(); }
  if(t.dataset.c==='find'){ FIND=t.value; return render(); }
  const pick=v=>{ const c=Object.values(CITIES).find(x=>x.name===v.trim()); return c&&c.code; };
  if(t.id==='cadd'){ const c=pick(t.value); if(c) goCity(c); return; }
  if(t.id==='jump'){ const c=pick(t.value); if(c&&MAP){ const ps=ROWS.filter(r=>r.code===c&&r.lat); if(ps.length) MAP.fitBounds(ps.map(r=>[r.lat,r.lon]),{padding:[30,30],maxZoom:15}); t.value=''; } } });
window.addEventListener('hashchange',()=>{ if(!ROWS.length) return; const t=S.tab,c=S.city; readHash(); if(t!==S.tab||c!==S.city){ save(); render(); } });
Promise.all([fetchJSON('live/base_table.json'),fetchJSON('live/points.json').catch(()=>({}))]).then(([d,pt])=>{ ROWS=d; PTS=pt; buildIndex(); ROWS.forEach(r=>{ if(r.code==='9999') return; if(!CITIES[r.code]) CITIES[r.code]={code:r.code,name:r.city}; }); readHash(); return render(); }).catch(e=>{ $('#app').innerHTML='<p class="empty">שגיאה בטעינת הנתונים: '+esc(e.message)+'</p>'; });
</script>
