<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניתוח לפי קלפיות – בחירות לכנסת ה-26</title>
<style>
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-latin.woff2) format("woff2")}
@font-face{font-family:"Petek";font-weight:900;font-display:swap;src:url(fonts/petek-hebrew.woff2) format("woff2")}
:root{--bg:#f3eee4;--card:#fffdf8;--line:#e2d9c6;--line2:#cfc4aa;--ink:#2a2722;--ink2:#67604f;--ink3:#9a917c;--acc:#136f73;--acc-soft:#e3efee;--up:#2c7a4b;--down:#a4432c;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.tabs{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--card)}
.tabs a{padding:7px 16px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}
.tabs a.on{background:var(--ink);color:#fff}
.nav .more{font-size:13px;color:var(--ink3);text-decoration:none}
.hd{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.hd .k{font-size:13px;color:var(--ink2)}
.hd h1{font-family:"Petek","Heebo",serif;font-weight:900;font-size:38px;line-height:1.05;margin:2px 0 4px;letter-spacing:.01em}
.hd .big{text-align:left}
.hd .big .v{font-size:40px;font-weight:800;line-height:1;color:var(--acc)}
.hd .big .l{font-size:12.5px;color:var(--ink2)}
.prog{height:10px;border-radius:5px;background:#e6dfd0;overflow:hidden;display:flex;direction:rtl;margin:8px 0 4px}
.prog span{height:100%}
.hatch{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)}
.srcs{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink2)}
.srcs b{color:var(--ink);font-weight:700}
.srcs i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-start:5px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;vertical-align:middle;margin-inline-start:6px}
.seg button{font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border:0;background:#fff;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{color:var(--ink3);cursor:default}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 6px}
.kp>div{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:9px 10px;text-align:center}
.kp .v{font-size:21px;font-weight:800;line-height:1.1}
.kp .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
@media (max-width:640px){
  .kp{display:block;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:2px 12px}
  .kp>div{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:baseline;border:0;border-radius:0;padding:7px 0;border-bottom:1px solid var(--line);text-align:right}
  .kp>div:last-child{border-bottom:0}
  .kp .v{font-size:17px} .kp .l{font-size:13.5px;margin:0}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:14px 0}
.card h2{font-family:"Petek","Heebo",serif;font-weight:900;font-size:24px;margin:0 0 2px;line-height:1.1}
.card .sub{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* חצי-טבעת */
.ring{position:relative}
.ring .c{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);text-align:center;line-height:1}
.ring .c .v{font-size:38px;font-weight:800}
.ring .c .l{font-size:11.5px;color:var(--ink2);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 8px 3px 6px;font-size:12.5px;background:#fff}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chip b{font-weight:700}
/* גושים */
.bbar{position:relative;height:22px;border-radius:5px;overflow:visible;display:flex;direction:rtl;background:#e6dfd0;margin:14px 0 18px}
.bbar span{height:100%}
.bbar span:first-child{border-radius:0 5px 5px 0}
.bbar .maj{position:absolute;top:-6px;height:34px;border-right:2px solid var(--ink);width:0}
.bbar .maj:after{content:'61';position:absolute;bottom:-17px;right:-8px;font-size:11px;color:var(--ink2)}
/* כרטיסי מפלגות */
.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.party{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center}
.slip{width:36px;height:50px;padding:2px;background:#fcfcf8;border:1px solid #c9c5b8;box-shadow:1px 2px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;grid-row:1/3;transform:rotate(-4deg)}
.slip b{font-family:"Petek","FrankRuehl",serif;font-weight:900;line-height:1;font-size:22px}
.slip.n3 b{font-size:16px}.slip.n2 b{font-size:20px}
.party .name{font-size:19px;font-weight:800;line-height:1.15}
.party .now{font-size:12.5px;color:var(--ink2)}
.party .now b{color:var(--up)} .party .now b.d{color:var(--down)}
.party .seats{font-size:40px;font-weight:900;line-height:1;grid-row:1/3;color:var(--pc)}
.party .sb{grid-column:1/4;height:10px;border-radius:5px;background:#eee8da;overflow:hidden;display:flex;direction:rtl;margin:8px 0 8px}
.party .sb span{height:100%}
.party .kv{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.party .kv div{display:flex;justify-content:space-between;gap:6px}
.party .kv .k{color:var(--ink2)} .party .kv .v{font-weight:600}
/* טבלאות */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;color:var(--ink2);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:bottom}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mute{color:var(--ink3)}
tr.tot td{font-weight:700;background:#faf6ec}
.up{color:var(--up);font-weight:600} .down{color:var(--down);font-weight:600}
.tw{overflow-x:auto}
h3{font-size:14px;font-weight:700;margin:14px 0 4px;color:var(--ink2)}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:12px 0}
summary{cursor:pointer;padding:12px 18px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{font-weight:400;color:var(--ink3);font-size:13px;text-align:left}
summary::after{content:'‹';color:var(--ink3);font-size:20px;transition:.15s}
details[open] summary::after{transform:rotate(-90deg)}
details .body{padding:0 18px 16px;font-size:14px;color:var(--ink2)}
details .body p{margin:6px 0}
/* חסימה */
.thr{display:grid;grid-template-columns:1fr 150px auto;gap:6px 12px;align-items:center;font-size:13.5px}
.thr .t{height:12px;background:#eee8da;border-radius:3px;position:relative}
.thr .t span{position:absolute;right:0;top:0;height:100%;border-radius:3px}
.thr .t:after{content:'';position:absolute;right:calc(100% * 3.25/4.5);top:-4px;height:20px;border-right:2px dashed var(--down)}
.thr .lab{grid-column:2;font-size:11.5px;color:var(--down);text-align:right;padding-right:calc(100% * 3.25/4.5 - 36px)}
.note{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
/* ספקולציות */
.spec select{font:inherit;font-size:15px;font-weight:600;padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;color:var(--ink);min-width:220px}
.spec .lead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px;color:var(--ink2);margin:10px 0 4px}
.spec .lead b{color:var(--ink)}
.spec .res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.spec .box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff}
.spec .box h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink2)}
.spec .big{font-size:30px;font-weight:800;line-height:1;margin:2px 0 4px}
.spec .big small{font-size:13px;font-weight:500;color:var(--ink2)}
.spec .who{font-size:14px;margin:4px 0}
.spec .who b{font-weight:700}
.spec .ctx{font-size:12.5px;color:var(--ink3);line-height:1.5}
.spec .tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--acc-soft);color:var(--acc);vertical-align:2px;margin-inline-start:6px}
.spec .tag.est{background:#f3e7df;color:#9c452f}
.spec .w{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:8px}
.spec .w label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.spec .w input{width:62px;font:inherit;font-size:13.5px;padding:4px 6px;border:1px solid var(--line2);border-radius:6px;text-align:center}
.spec .w .sum{font-size:12.5px;color:var(--ink3);grid-column:1/-1}
.spec .w .sum.bad{color:var(--down);font-weight:600}
.spec .lnk{font:inherit;font-size:12.5px;color:var(--acc);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
@media (max-width:640px){ .spec .res{grid-template-columns:1fr} .spec .big{font-size:26px} }
.empty{color:var(--ink2);padding:24px 0;text-align:center}
@media (max-width:640px){ .hd{grid-template-columns:1fr} .hd .big{text-align:right} .hd h1{font-size:31px} .two,.parties{grid-template-columns:1fr} .party .seats{font-size:34px} td,th{padding:6px 4px;font-size:13px} .wrap{padding:10px 10px 50px} }
@media print{ body{background:#fff} .nav{display:none} .card,.party,details{break-inside:avoid} }

.ctl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin:0 0 12px}
.ctl label{font-size:13px;color:var(--ink2)}
.ctl input[type=text],.ctl select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;width:100%;max-width:420px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips2 span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;font-size:13px;background:#fff}
.chips2 span b{cursor:pointer;color:var(--ink3)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 14px}
.strip>div{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:8px 10px}
.strip .v{font-size:20px;font-weight:800;line-height:1.1} .strip .v small{font-size:12px;font-weight:500;color:var(--ink3)} .strip .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--ink2);margin:0 0 8px}
.tools select,.tools button{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
table.px{font-size:13px}
table.px th{font-size:12px;line-height:1.2}
table.px td{padding:7px 6px}
table.px tr.pl{cursor:pointer}
table.px tr.pl:hover td{background:#faf6ec}
table.px tr.pl.open td{background:var(--acc-soft)}
table.px td.name{font-weight:700;white-space:normal;min-width:150px}
table.px .tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:5px;background:#f3e7df;color:#9c452f;margin-inline-start:6px;vertical-align:1px}
table.px .tag.new{background:var(--acc-soft);color:var(--acc)}
table.px td.d{font-weight:700}
table.px .sub{font-size:11.5px;color:var(--ink3);font-weight:400}
tr.detail td{background:#fbfaf5;padding:10px 12px 12px}
tr.tot td{font-weight:700;background:#faf6ec}
.det{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.det h4{margin:0 0 6px;font-size:13px;color:var(--ink2)}
table.bx{font-size:12px} table.bx td,table.bx th{padding:4px 5px}
.flow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:12.5px}
.flow .b{height:12px;background:#eee8da;border-radius:3px;position:relative;overflow:hidden}
.flow .b span{position:absolute;top:0;height:100%;border-radius:3px}
.flow .n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px}
.chart-note{font-size:12px;color:var(--ink3);margin-top:6px}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg2 button{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border:0;background:#fff;color:var(--ink2);cursor:pointer}
.seg2 button.on{background:var(--ink);color:#fff}
@media (max-width:640px){ .det{grid-template-columns:1fr} table.px{font-size:12px} .ctl{grid-template-columns:1fr} }
</style>

<script src="vendor/leaflet/leaflet.js"></script>
<style>
#map{height:66vh;min-height:380px;border-radius:10px;border:1px solid var(--line);background:#eee8dd}
.leaflet-container{font-family:inherit;font-size:13px}

<script>
'use strict';
const LISTS=[
  {id:'utj',   name:'יהדות התורה', letter:'ג',  p22:['ג'],  color:'#7d6448'},
  {id:'shas',  name:'ש"ס',         letter:'שס', p22:['שס'], color:'#4a3b2a'},
  {id:'otzma', name:'עוצמה יהודית', letter:'ב', p22:null,   color:'#d2865a'},
  {id:'rzd',   name:'הציונות הדתית', letter:'ט', p22:null,  color:'#b85c3a'},
  {id:'likud', name:'הליכוד',       letter:'מחל', p22:['מחל'], color:'#8c3a2b'},
  {id:'zach',  name:'הציבור החרדי', letter:'זך', p22:null,  color:'#9a917c'},
  {id:'ner',   name:'צבע שחור',     letter:'נר', p22:null,  color:'#b9b2a2'},
  {id:'yashar',name:'ישר!',         letter:'דרך', p22:['פה','כן'], color:'#136f73'},
];
const MORE=[
  {name:'ביחד', l26:['רק'], l22:[]}, {name:'הדמוקרטים (מול עבודה + מרצ)', l26:['אמת'], l22:['אמת','מרצ']}, {name:'ישראל ביתנו', l26:['ל'], l22:['ל']},
  {name:'המילואימניקים', l26:['די'], l22:[]}, {name:'עמך ישראל', l26:['ך'], l22:[]}, {name:'רע"ם', l26:['עם'], l22:['עם']}, {name:'הרשימה המשותפת (מול חד"ש-תע"ל + בל"ד)', l26:['ודם'], l22:['ום','ד']},
];
const COMBO={name:'עוצמה + הציונות הדתית', letters:['ב','ט'], p22:['ט'], color:'#c0704a'};
const DISTRICTS=['ירושלים','צפון','חיפה','מרכז','תל אביב','דרום','יהודה ושומרון','אחר'];
const $=s=>document.querySelector(s);
const fmt=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('he-IL');
const pc=(v,d=1)=> v==null||isNaN(v)? '—' : (v*100).toFixed(d)+'%';
const sgn=(d,dd=1)=> d==null||isNaN(d)? '—' : (d>=0?'+':'−')+Math.abs(d).toFixed(dd);
const cls=d=> d==null||isNaN(d)? '' : (d>=0?'up':'down');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function fetchJSON(u,tries=2){ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),25000); try{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } catch(e){ if(tries>1){ await new Promise(r=>setTimeout(r,800)); return fetchJSON(u,tries-1); } throw e; } finally{ clearTimeout(tm); } }
let IDX=null, LOC={}, ST=(()=>{ try{ return JSON.parse(localStorage.getItem('k26.kalpiot'))||{}; }catch(e){ return {}; } })();
if(!ST.v2){ ST.v2=1; ST.mode='sum'; }
if(!ST.mode) ST.mode='sum'; if(!ST.city) ST.city='3780'; if(!ST.group) ST.group=[]; if(!ST.district) ST.district='דרום';
let SORT='name', OPEN=new Set(), FIND='';
const save=()=>{ try{ localStorage.setItem('k26.kalpiot',JSON.stringify(ST)); }catch(e){} };
async function getLoc(code){ if(!LOC[code]) LOC[code]=await fetchJSON('live/loc/'+code+'.json'); return LOC[code]; }

/* ---------- חישובים ---------- */
const sum=(bx,f)=>bx.reduce((a,b)=>a+f(b),0);
const votesOf=(bx,letters)=>sum(bx,b=>letters.reduce((a,l)=>a+(b.votes[l]||0),0));
const agg=bx=>({n:bx.length, e:sum(bx,b=>b.e), v:sum(bx,b=>b.v), k:sum(bx,b=>b.k)});
function stats(b26,b22){
  const a26=agg(b26), a22=agg(b22); const row={a26,a22,lists:{}};
  LISTS.forEach(l=>{ const v26=votesOf(b26,[l.letter]); const v22= l.p22? votesOf(b22,l.p22) : null; row.lists[l.id]={v26,v22,s26:a26.k?v26/a26.k:null,s22:(v22!=null&&a22.k)?v22/a22.k:null}; });
  const c26=votesOf(b26,COMBO.letters), c22=votesOf(b22,COMBO.p22); row.combo={v26:c26,v22:c22,s26:a26.k?c26/a26.k:null,s22:a22.k?c22/a22.k:null};
  row.by26={}; row.by22={}; b26.forEach(b=>Object.entries(b.votes).forEach(([l,n])=>row.by26[l]=(row.by26[l]||0)+n)); b22.forEach(b=>Object.entries(b.votes).forEach(([l,n])=>row.by22[l]=(row.by22[l]||0)+n));
  return row;
}
function statsAgg(a26,a22){ // מתוך האינדקס (סיכומי יישוב)
  const row={a26:{n:0,e:a26.e,v:a26.v,k:a26.k},a22:{n:0,e:a22.e,v:a22.v,k:a22.k},lists:{}};
  const vo=(a,letters)=>letters.reduce((s,l)=>s+(a.votes[l]||0),0);
  LISTS.forEach(l=>{ const v26=vo(a26,[l.letter]); const v22= l.p22? vo(a22,l.p22) : null; row.lists[l.id]={v26,v22,s26:a26.k?v26/a26.k:null,s22:(v22!=null&&a22.k)?v22/a22.k:null}; });
  const c26=vo(a26,COMBO.letters), c22=vo(a22,COMBO.p22); row.combo={v26:c26,v22:c22,s26:a26.k?c26/a26.k:null,s22:a22.k?c22/a22.k:null};
  row.by26={...a26.votes}; row.by22={...a22.votes};
  return row;
}
const dpts=(s26,s22)=> (s26!=null&&s22!=null)? (s26-s22)*100 : null;

const cells=st=>{ const t26=st.a26.e? st.a26.v/st.a26.e : null, t22=st.a22.e? st.a22.v/st.a22.e : null; return `<td class="n">${fmt(st.a26.e)||'—'}</td><td class="n">${pc(t26)}<div class="sub">2022: ${pc(t22)}</div></td><td class="n d ${cls(dpts(t26,t22))}">${t26!=null&&t22!=null?sgn(dpts(t26,t22)):'—'}</td>${cell(st.lists.utj)}${cell(st.lists.shas)}${cell(st.combo)}${cell(st.lists.likud)}`; };

let CSVROWS=[];

function tools(sortOpts){ return `<div class="tools"><span>מיון:</span><select id="sort">${sortOpts.map(([v,t])=>`<option value="${v}" ${SORT===v?'selected':''}>${t}</option>`).join('')}</select><button id="openAll">פתח הכל</button><button id="closeAll">סגור הכל</button><button id="csv">הורד CSV</button></div>`; }
const sortKey=(st,name)=>{ if(SORT==='dutj') return -(dpts(st.lists.utj.s26,st.lists.utj.s22)??-999); if(SORT==='dshas') return -(dpts(st.lists.shas.s26,st.lists.shas.s22)??-999); if(SORT==='size') return -st.a26.e; if(SORT==='utj') return -(st.lists.utj.s26??-1); return name; };
const srt=(arr,key)=>[...arr].sort((a,b)=>{ const ka=key(a),kb=key(b); return typeof ka==='string'? ka.localeCompare(kb,'he') : ka-kb; });

async function cityView(code){
  const city=await getLoc(code); const idx=IDX[code]||{};

  let h=strip(tot,`<div><div class="v">${city.n26} <small>2022: ${city.n22}</small></div><div class="l">קלפיות${idx.district?' · מחוז '+esc(idx.district):''}</div></div>`);
  h+=flowCard(tot,city.name);

    if(q){ places=places.filter(hit); if(places.length<=3) places.forEach(p=>OPEN.add(p.name||('old:'+p.name22))); if(!places.length) h+=`<p class="empty">לא נמצא מקום קלפי או מספר קלפי "${esc(FIND)}".</p>`; }

    srt(places,p=>sortKey(p.st,p.name||'\uffff')).forEach(p=>{ const k=p.name||('old:'+p.name22); const isOpen=OPEN.has(k);
      const nm= p.name? esc(p.name)+(p.name22?'':'<span class="tag new">חדש ב-2026</span>') : esc(p.name22)+'<span class="tag">לא פעיל ב-2026</span>';

}
function groupView(codes,title){

  const sumA=k=>rows.reduce((a,r)=>a+(r.st[k].e||0),0);
  const A26={e:0,v:0,k:0,votes:{}}, A22={e:0,v:0,k:0,votes:{}};
  codes.filter(c=>IDX[c]).forEach(c=>{ for(const [A,a] of [[A26,IDX[c].a26],[A22,IDX[c].a22]]){ A.e+=a.e; A.v+=a.v; A.k+=a.k; Object.entries(a.votes).forEach(([l,n])=>A.votes[l]=(A.votes[l]||0)+n); } });
  const tot=statsAgg(A26,A22);
  setTimeout(()=>{ const t=$('#ttl'); if(t) t.textContent=title; const b=$('#bigbox'); if(b) b.innerHTML=`<div class="v">${pc(tot.lists.utj.s26)}</div><div class="l">יהדות התורה · 2022: ${pc(tot.lists.utj.s22)}</div>`; },0);
  let h=strip(tot,`<div><div class="v">${rows.length}</div><div class="l">יישובים</div></div>`);
  if(!rows.length) return h+`<p class="empty">בחר יישובים מהרשימה.</p>`;
  h+=flowCard(tot,title);
  h+=tools([['name','לפי שם'],['dutj','לפי השינוי ביהדות התורה'],['dshas','לפי השינוי בש"ס'],['utj','לפי אחוז יהדות התורה'],['size','לפי גודל']]);

  CSVROWS=[];
  srt(sel,p=>sortKey(p.st,p.name)).forEach(p=>{ h+=`<tr><td class="name">${esc(p.name)}${p.pt?`<div class="sub">${esc(p.pt[2]||'')}${p.pt[3]?' · '+esc(p.pt[3]):''}</div>`:'<div class="sub">לא ממוקם</div>'}</td><td class="n">${p.st.a26.n} / ${p.st.a22.n}</td>${cells(p.st)}</tr>`; CSVROWS.push([IDX[ST.city].name,p.name,p.name22||'',p.st]); });
  if(old.length){ const ist=stats([],old.flatMap(p=>p.boxes22)); h+=`<tr><td class="name">מקומות קלפי של 2022 שלא פעלו ב-2026<div class="sub">${old.length} מקומות, ללא מיקום במפה</div></td><td class="n">0 / ${ist.a22.n}</td>${cells(ist)}</tr>`; }
  h+=`<tr class="tot"><td>סה"כ ${esc(title)}</td><td class="n">${st.a26.n} / ${st.a22.n}</td>${cells(st)}</tr></table></div><div class="tools" style="margin-top:8px"><button id="csv">הורד CSV</button></div></div>`;
  return h;
}
function mountMap(){
  const el=$('#map'); if(!el||typeof L==='undefined') return;
  const located=MAPPL.filter(p=>p.pt);
  MAP=L.map('map',{zoomControl:true}); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
  if(located.length){ MAP.fitBounds(located.map(p=>p.pt.slice(0,2)),{padding:[20,20]}); } else MAP.setView([31.8,35.1],8);
  const mx=Math.max(1,...located.map(p=>p.st.a26.e));
  located.forEach(p=>{ const v=metric(p.st); const t26=p.st.a26.e?p.st.a26.v/p.st.a26.e:null;
    const m=L.circleMarker(p.pt.slice(0,2),{radius:6+14*Math.sqrt(p.st.a26.e/mx),color:'#2a2722',weight:1,fillColor:mcolor(v),fillOpacity:1}).addTo(MAP);
    m.bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.pt[2]||'')}${p.pt[3]?' · '+esc(p.pt[3]):''}<br>קלפיות ${p.boxes26.map(b=>b.box).join(', ')} · בז"ב ${fmt(p.st.a26.e)}<br>הצבעה ${pc(t26)} · יהדות התורה ${pc(p.st.lists.utj.s26)} (${sgn(dpts(p.st.lists.utj.s26,p.st.lists.utj.s22))}) · ש"ס ${pc(p.st.lists.shas.s26)} (${sgn(dpts(p.st.lists.shas.s26,p.st.lists.shas.s22))})<br>${METRICS.find(x=>x[0]===MAPM)[1]}: <b>${v==null?'—':(MAPM[0]==='d'?sgn(v):v.toFixed(1)+'%')}</b>`);
  });
  const redraw=()=>{ if(POLYL){ MAP.removeLayer(POLYL); POLYL=null; } if(POLY.length) POLYL=(POLY.length>=3?L.polygon(POLY,{color:'#8c3a2b',weight:2,fillOpacity:.08}):L.polyline(POLY,{color:'#8c3a2b',weight:2,dashArray:'4 4'})).addTo(MAP); const r=$('#mapres'); if(r){ r.innerHTML=mapResults(); const cs=$('#csv'); if(cs) cs.onclick=downloadCSV; } const c=$('#clearPoly'); if(c) c.disabled=!POLY.length; };
  MAP.on('click',e=>{ if(!DRAW) return; POLY.push([e.latlng.lat,e.latlng.lng]); redraw(); });
  $('#draw').onclick=()=>{ DRAW=!DRAW; const b=$('#draw'); b.classList.toggle('on',DRAW); b.textContent=DRAW?'מסמן… לחץ על המפה (סיום בלחיצה על הכפתור)':'סמן שטח'; el.style.cursor=DRAW?'crosshair':''; if(!DRAW&&POLY.length&&POLY.length<3){ POLY=[]; } redraw(); };
  $('#clearPoly').onclick=()=>{ POLY=[]; DRAW=false; $('#draw').classList.remove('on'); $('#draw').textContent='סמן שטח'; el.style.cursor=''; redraw(); };
  $('#mapm').onchange=e=>{ MAPM=e.target.value; render(); };
  redraw();
}
function sumAgg(codes){ const A26={e:0,v:0,k:0,votes:{}}, A22={e:0,v:0,k:0,votes:{}}; codes.forEach(c=>{ for(const [A,a] of [[A26,IDX[c].a26],[A22,IDX[c].a22]]){ A.e+=a.e; A.v+=a.v; A.k+=a.k; Object.entries(a.votes).forEach(([l,n])=>A.votes[l]=(A.votes[l]||0)+n); } }); return statsAgg(A26,A22); }
function nationalView(){
  const all=Object.keys(IDX); const tot=sumAgg(all);
  setTimeout(()=>{ const t=$('#ttl'); if(t) t.textContent='כלל ארצי'; const b=$('#bigbox'); if(b) b.innerHTML=`<div class="v">${pc(tot.lists.utj.s26)}</div><div class="l">יהדות התורה · 2022: ${pc(tot.lists.utj.s22)}</div>`; },0);
  let h=strip(tot,`<div><div class="v">${fmt(all.reduce((a,c)=>a+IDX[c].n26,0))}</div><div class="l">קלפיות · ${all.length} יישובים</div></div>`);
  h+=flowCard(tot,'כלל ארצי');
  const rows=DISTRICTS.map(d=>({d, codes:all.filter(c=>IDX[c].district===d && c!=='9999')})).filter(r=>r.codes.length).map(r=>({...r, st:sumAgg(r.codes)}));
  if(IDX['9999']){ const st=sumAgg(['9999']); st.a26.e=0; st.a22.e=0; rows.push({d:'מעטפות חיצוניות (כפולות)', codes:['9999'], st, ext:true}); }
  h+=tools([['name','לפי שם'],['dutj','לפי השינוי ביהדות התורה'],['dshas','לפי השינוי בש"ס'],['utj','לפי אחוז יהדות התורה'],['size','לפי גודל']]);
  h+=`<div class="card" style="padding:10px 12px"><div class="tw"><table class="px num"><tr><th>מחוז</th><th class="n">יישובים</th>${HEADS}</tr>`;
  CSVROWS=[];
  srt(rows,r=>r.ext?'\uffff':sortKey(r.st,r.d)).forEach(r=>{ h+= r.ext? `<tr><td class="name">${esc(r.d)}<div class="sub">חיילים, שליחים, אסירים, מאושפזים ועוד · נספרות במרוכז, בלי בז"ב</div></td><td class="n">—</td>${cells(r.st)}</tr>` : `<tr class="pl" data-k="${esc(r.d)}" data-dist="${esc(r.d)}" title="לפתיחת המחוז"><td class="name">${esc(r.d)}</td><td class="n">${r.codes.length}</td>${cells(r.st)}</tr>`; CSVROWS.push(['מחוז '+r.d,'','',r.st]); });
  h+=`<tr class="tot"><td>סה"כ ארצי</td><td class="n">${all.length}</td>${cells(tot)}</tr></table></div><div class="note">לחיצה על מחוז פותחת את היישובים שבו. "אחר" = יישובים בלי מחוז ברשימת הלמ"ס. אחוז ההצבעה הארצי כולל את המעטפות החיצוניות, כמו בפרסום הרשמי. המחוזות לפי הלמ"ס.</div></div>`;
  return h;
}
function detail(p){
  const st=p.st;
  const bx=(boxes,yr)=>`<h4>קלפיות ${yr} (${boxes.length})</h4><table class="bx num"><tr><th>קלפי</th><th class="n">בז"ב</th><th class="n">הצבעה</th><th class="n">כשרים</th><th class="n">יהדות התורה</th><th class="n">ש"ס</th><th class="n">${yr==='2026'?'עוצמה':'ט'}</th>${yr==='2026'?'<th class="n">ציונות דתית</th>':''}<th class="n">ליכוד</th></tr>${boxes.map(b=>`<tr><td>${esc(b.box)}</td><td class="n">${fmt(b.e)}</td><td class="n">${pc(b.e?b.v/b.e:null)}</td><td class="n">${fmt(b.k)}</td><td class="n">${pc(b.k?(b.votes['ג']||0)/b.k:null)}</td><td class="n">${pc(b.k?(b.votes['שס']||0)/b.k:null)}</td><td class="n">${pc(b.k?(b.votes[yr==='2026'?'ב':'ט']||0)/b.k:null)}</td>${yr==='2026'?`<td class="n">${pc(b.k?(b.votes['ט']||0)/b.k:null)}</td>`:''}<td class="n">${pc(b.k?(b.votes['מחל']||0)/b.k:null)}</td></tr>`).join('')}</table>`;
  return `<div class="det"><div>${bx(p.boxes26,'2026')}${p.boxes22.length?bx(p.boxes22,'2022'):''}</div><div>${flowPanel(st,p.name||p.name22,'שינוי במספר הקולות במקום הזה, 2026 פחות 2022.')}</div></div>`;
}
function downloadCSV(){
  if((ST.mode==='muni'||ST.mode==='sum')&&MUCSV.length){ const t='\ufeff'+MUCSV.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'})); a.download='kalpiot_muni.csv'; a.click(); return; }
  const H=['יישוב','מקום / קלפי 2026','מקום 2022','בז"ב 2026','מצביעים 2026','כשרים 2026','בז"ב 2022','מצביעים 2022','כשרים 2022','יהדות התורה 2026','יהדות התורה 2022','ש"ס 2026','ש"ס 2022','עוצמה+ציונות 2026','ט 2022','ליכוד 2026','ליכוד 2022','הציבור החרדי 2026','צבע שחור 2026'];
  const L=CSVROWS.map(([city,n,n22,s])=>[city,n,n22,s.a26.e,s.a26.v,s.a26.k,s.a22.e,s.a22.v,s.a22.k,s.lists.utj.v26,s.lists.utj.v22??'',s.lists.shas.v26,s.lists.shas.v22??'',s.combo.v26,s.combo.v22,s.lists.likud.v26,s.lists.likud.v22??'',s.lists.zach.v26,s.lists.ner.v26]);
  const csv='\ufeff'+[H,...L].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='kalpiot.csv'; a.click();
}
let NB=null, MU=null;
fetchJSON('live/muni2024.json').then(d=>{ MU=d; if(IDX&&ST.mode==='muni') render(); }).catch(()=>{ MU={}; });
fetchJSON('live/place_nbhd.json').then(d=>{ NB=d; if(IDX&&(ST.mode==='nbhd'||(ST.mode==='sum'&&OPEN.size))) render(); }).catch(()=>{ NB={}; });
fetchJSON('live/loc_index.json').then(d=>{ IDX=d; if(!IDX[ST.city]) ST.city='3780'; render(); }).catch(e=>{ $('#app').innerHTML='<p class="empty">שגיאה בטעינת הנתונים: '+esc(e.message)+'</p>'; });
</script>
