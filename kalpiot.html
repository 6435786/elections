<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניתוח הבחירות – 2022, 2024, 2026</title>
<style>
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-latin.woff2) format("woff2")}
@font-face{font-family:"Petek";font-weight:900;font-display:swap;src:url(fonts/petek-hebrew.woff2) format("woff2")}
:root{--bg:#f3eee4;--card:#fffdf8;--line:#e2d9c6;--line2:#cfc4aa;--ink:#2a2722;--ink2:#67604f;--ink3:#8f8670;--acc:#136f73;--acc-soft:#e3efee;--up:#2c7a4b;--down:#a4432c;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px 60px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#fff}
.seg2 button{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.seg2 button.on{background:var(--ink);color:#fff}
.more{font-size:13px;color:var(--ink3);text-decoration:none}
.hd{padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.hd .k{font-size:13px;color:var(--ink2)}
.hd h1{font-family:"Petek","Heebo",serif;font-weight:900;font-size:36px;line-height:1.08;margin:2px 0 0;letter-spacing:.01em}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;margin:0 0 14px}
.ctl>label{font-size:13px;color:var(--ink2)}
input[type=text],select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;max-width:100%}
input[type=text]{width:320px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips span,.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:6px;padding:3px 9px;font-size:13px;background:#fff;cursor:pointer;user-select:none}
.chips span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips b{color:var(--ink3);cursor:pointer}
.chips input{margin:0}
.btn{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.strip>div{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:8px 10px}
.strip .v{font-size:20px;font-weight:800;line-height:1.15}
.strip .v small{font-size:12px;font-weight:500;color:var(--ink3)}
.strip .l{font-size:12px;color:var(--ink2);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 14px}
.card h2{font-size:17px;font-weight:800;margin:0 0 4px}
.card .sub{font-size:13px;color:var(--ink2);margin:0 0 10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;padding:6px;border-bottom:1.5px solid var(--line2);vertical-align:bottom;line-height:1.25;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
td.name{font-weight:600;min-width:140px}
td b{font-weight:700}
.s{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.up{color:var(--up)} .down{color:var(--down)}
tr.pl{cursor:pointer} tr.pl:hover td{background:#faf6ec} tr.pl.open td{background:var(--acc-soft)}
tr.tot td{font-weight:700;background:#faf6ec}
tr.subrow td{color:var(--ink2);font-size:12.5px} tr.subrow td.name{font-weight:400;padding-inline-start:16px}
tr.detail td{background:#fbfaf5;padding:10px 12px}
.tier{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;margin-inline-start:6px;vertical-align:1px;background:#e8e2d3;color:var(--ink2)}
.tier.t3{background:var(--acc-soft);color:var(--acc)} .tier.t1,.tier.t0{background:#f3e7df;color:#9c452f}
.note{font-size:12.5px;color:var(--ink3);margin:8px 0 0}
.empty{color:var(--ink2);padding:14px 2px}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--ink2);margin:0 0 8px}
#report{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;line-height:1.7}
#report h2{font-family:"Petek","Heebo",serif;font-weight:900;font-size:24px;margin:0 0 2px}
#report h3{font-size:15px;font-weight:800;margin:14px 0 2px}
#report p{margin:0 0 4px}
#report .meta{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
#map{height:62vh;min-height:360px;border-radius:var(--r);border:1px solid var(--line);background:#eee8dd;margin-bottom:8px}
.leaflet-container{font-family:inherit;font-size:13px}
.leaflet-popup-content{margin:10px 12px;direction:rtl;text-align:right;line-height:1.5;min-width:200px}
#printarea{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;margin:0 0 10px;font-size:13.5px}
.bar .sum b{font-weight:700}.bar .sum span{color:var(--ink3)}
.subtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1.5px solid var(--line2);margin:0 0 14px;scrollbar-width:none}
.subtabs button{font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border:0;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.legendm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.legendm i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-start:4px;vertical-align:-1px}
@media (max-width:640px){ .ctl{grid-template-columns:1fr} .hd h1{font-size:27px} input[type=text]{width:100%} .wrap{padding:10px 10px 50px}
  .card table,.card tbody{display:block} .card tr.hrow{display:none}
  .card tr{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .card td{display:block;border:0;padding:1px 0;text-align:right!important;white-space:normal}
  .card td.name,.card td[colspan]{grid-column:1/-1}
  .card td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3);font-weight:400}
  .card tr.detail{display:block} .card .hm{display:none} .card table.places .n .s{display:none}
  .strip{grid-template-columns:1fr 1fr} .strip .v{font-size:18px} #report{padding:12px} }
@media print{ html,body{background:#fff;font-size:12.5px} body.rp .wrap{display:none!important} body.rp #printarea{display:block!important} #printarea .noprint{display:none!important} #report{border:0;padding:0;margin:0} .tw{overflow:visible} table{font-size:10.5px;table-layout:fixed} th,td{padding:4px 3px} td.n,th.n{white-space:normal;text-align:right} td.name{min-width:0} .s{font-size:9.5px} #report .card{border:0;padding:0;background:transparent} h3{break-after:avoid} tr{break-inside:avoid} @page{margin:14mm 12mm} }
</style>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
<div class="wrap"><div id="app"><p class="empty">טוען נתונים…</p></div></div><div id="printarea"></div>
<script>
'use strict';
const CERT='ודאי',NEAR='כמעט ודאי',GUESS='השערה',NONE='ללא שיוך'; const TIERS=[CERT,NEAR,GUESS,NONE]; const TCLS={[CERT]:3,[NEAR]:2,[GUESS]:1,[NONE]:0};
const PN={'ג':'יהדות התורה','שס':'ש"ס','מחל':'הליכוד','ט':'הציונות הדתית','ב':'עוצמה יהודית','ך':'עמך ישראל','דרך':'ישר!','רק':'ביחד','אמת':'הדמוקרטים','ל':'ישראל ביתנו','די':'המילואימניקים','עם':'רע"ם','ודם':'הרשימה המשותפת','זך':'הציבור החרדי','נר':'צבע שחור'};
const CONC=['1309','70','2033','440','766','2610','3780','6100','6200','3730','4000','6700','3000','3797','1061','7400','3660','7900','8000','2630','8400','3815','3779'];
const NO_DATA=[null,undefined];
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('he-IL');
const pc=(v,d=1)=>(v==null||isNaN(v)||!isFinite(v))?'—':(v*100).toFixed(d)+'%';
const sgn=(d,dd=1)=>(d==null||isNaN(d)||!isFinite(d))?'—':'\u200E'+(d>=0?'+':'−')+Math.abs(d).toFixed(dd);
const sgi=n=>(n==null||isNaN(n))?'—':'\u200E'+(n>=0?'+':'−')+fmt(Math.abs(n));
const cls=d=>(d==null||isNaN(d)||d===0)?'':(d>0?'up':'down');
const rel=(a,b)=>(a!=null&&b!=null&&b>0)?(a-b)/b*100:null;
const div=(a,b)=>(a!=null&&b)?a/b:null;
const lv=(v,ls)=>ls.reduce((a,l)=>a+(v[l]||0),0);
const bv=(b,ks)=>ks.reduce((a,k)=>a+(b[k]||0),0);
async function fetchJSON(u,tries=2){ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),40000); try{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }catch(e){ if(tries>1){ await new Promise(r=>setTimeout(r,800)); return fetchJSON(u,tries-1); } throw e; }finally{ clearTimeout(tm); } }
let ROWS=[],CITIES={},LOC={},S=(()=>{ try{ return JSON.parse(localStorage.getItem('k26.k2'))||{}; }catch(e){ return {}; } })();
S.tab=S.tab||'over'; S.scope=S.scope||'cities'; S.cities=S.cities||['3780']; S.dist=S.dist||'ירושלים'; S.nsel=S.nsel||{}; S.tiers=S.tiers||{[CERT]:true,[NEAR]:true,[GUESS]:true,[NONE]:true}; S.th=S.th||60; S.metric=S.metric||'utj';
S.sub=S.sub||'report'; let OPEN=new Set(),CSV=[],POLY=[],DRAW=false,MAP=null,POLYL=null,FLOWSRC=null,CTL=false,FIND='';
const save=()=>{ try{ localStorage.setItem('k26.k2',JSON.stringify(S)); }catch(e){} };
const getLoc=async c=>LOC[c]||(LOC[c]=await fetchJSON('live/loc/'+c+'.json'));
const inTier=r=>!!S.tiers[r.tier];
const allOn=()=>TIERS.every(t=>S.tiers[t]);

/* ---------- סיכום שורות ---------- */
function agg(rows){ const A={y26:{n:0,e:0,v:0,k:0,votes:{}},y22:{n:0,e:0,v:0,k:0,votes:{}},m:{n:0,e:0,v:0,k:0,b:{}},rows:0,g26:{},gtot:0};
  rows.forEach(r=>{ if(!inTier(r)) return; A.rows++;
    for(const y of ['y26','y22']){ const a=A[y],s=r[y]; a.n+=s.n; a.e+=s.e; a.v+=s.v; a.k+=s.k; for(const l in s.votes) a.votes[l]=(a.votes[l]||0)+s.votes[l]; }
    if(r.m&&S.tiers[r.m_tier||NONE]){ const a=A.m; a.n+=r.m.n; a.e+=r.m.e; a.v+=r.m.v; a.k+=r.m.k; for(const k in r.m.b) a.b[k]=(a.b[k]||0)+r.m.b[k]; }
  }); return A; }
function certShare(rows){ let c=0,t=0; rows.forEach(r=>{ if(r.split){ for(const k in r.split){ t+=r.split[k].g26||0; if(k===CERT) c+=r.split[k].g26||0; } } else { const g=r.y26.votes['ג']||0; t+=g; if(r.tier===CERT) c+=g; } }); return t?c/t:null; }
const PARTIES=[
 {id:'utj',t:'יהדות התורה',k:['ג'],k22:['ג'],m:['dagel','aguda','utj'],mn:'דגל + אגודה'},
 {id:'dagel',t:'דגל התורה',sub:1,m:['dagel'],mn:'2024 בלבד'},
 {id:'aguda',t:'אגודת ישראל',sub:1,m:['aguda'],mn:'2024 בלבד'},
 {id:'utjj',t:'דגל ואגודה ברשימה משותפת',sub:1,m:['utj'],mn:'2024 בלבד'},
 {id:'shas',t:'ש"ס',k:['שס'],k22:['שס'],m:['shas']},
 {id:'joint',t:'משותפת יהדות התורה + ש"ס',sub:1,m:['joint'],mn:'2024 בלבד'},
 {id:'both',t:'יהדות התורה + ש"ס',k:['ג','שס'],k22:['ג','שס'],m:['dagel','aguda','utj','shas','joint'],tot:1},
 {id:'ner',t:'צבע שחור',k:['נר'],k22:null,m:null},
 {id:'peleg',t:'בני תורה (עץ)',sub:1,m:['peleg'],mn:'2024 בלבד'},
 {id:'zach',t:'הציבור החרדי',k:['זך'],k22:null,m:null},
 {id:'other',t:'רשימות חרדיות אחרות',sub:1,m:['other'],mn:'2024 בלבד'},
 {id:'right',t:'עוצמה + הציונות הדתית',k:['ב','ט'],k22:['ט'],m:null,n22:'ב-2022 רשימה אחת'},
];
function pcell(v,e,k){ if(v==null) return '<td class="n">—</td>'; return `<td class="n"><b>${pc(div(v,e))}</b><span class="s">${fmt(v)} קולות · ${pc(div(v,k))} מהכשרים</span></td>`; }
function chg(v1,e1,v0,e0){ if(v1==null||v0==null||!e1||!e0) return '<td class="n">—</td>'; const p1=v1/e1,p0=v0/e0,r=rel(p1,p0); return `<td class="n"><b class="${cls(r)}">${r==null?'—':sgn(r)+'%'}</b><span class="s">${sgn((p1-p0)*100)} נק׳ · ${sgi(v1-v0)} קולות</span></td>`; }
function partyTable(A){ const y6=A.y26,y2=A.y22,m=A.m; const has=m.n>0;
  let h=`<div class="tw"><table class="num"><tr><th>רשימה</th><th class="n">2022<br>% מהבז"ב</th><th class="n">2024<br>% מהבז"ב</th><th class="n">2026<br>% מהבז"ב</th><th class="n">שינוי<br>מ-2022</th><th class="n">שינוי<br>מ-2024</th></tr>`;
  h+=`<tr class="subrow"><td class="name" style="padding-inline-start:6px">בעלי זכות בחירה</td><td class="n">${fmt(y2.e)}</td><td class="n">${has?fmt(m.e):'—'}</td><td class="n">${fmt(y6.e)}</td><td class="n">${y2.e?sgn(rel(y6.e,y2.e))+'%':'—'}</td><td class="n">${has&&m.e?sgn(rel(y6.e,m.e))+'%':'—'}</td></tr>`;
  h+=`<tr class="subrow"><td class="name" style="padding-inline-start:6px">אחוז הצבעה</td><td class="n">${pc(div(y2.v,y2.e))}</td><td class="n">${has?pc(div(m.v,m.e)):'—'}</td><td class="n">${pc(div(y6.v,y6.e))}</td><td class="n">${y2.e&&y6.e?sgn((y6.v/y6.e-y2.v/y2.e)*100)+' נק׳':'—'}</td><td class="n">${has&&m.e&&y6.e?sgn((y6.v/y6.e-m.v/m.e)*100)+' נק׳':'—'}</td></tr>`;
  PARTIES.forEach(p=>{ const v6=p.k?lv(y6.votes,p.k):null, v2=p.k22?lv(y2.votes,p.k22):null, vm=p.m&&has?bv(m.b,p.m):null;
    if(p.sub&&!(vm>0)) return;
    h+=`<tr class="${p.sub?'subrow':(p.tot?'tot':'')}"><td class="name">${esc(p.t)}${p.mn&&!p.sub?`<span class="s">2024: ${esc(p.mn)}</span>`:''}${p.n22?`<span class="s">${esc(p.n22)}</span>`:''}</td>${p.sub?'<td class="n">—</td>':pcell(v2,y2.e,y2.k)}${p.m?pcell(vm,m.e,m.k):'<td class="n">—</td>'}${p.sub?'<td class="n">—</td>':pcell(v6,y6.e,y6.k)}${chg(v6,y6.e,v2,y2.e)}${chg(v6,y6.e,vm,m.e)}</tr>`; });
  h+=`</table></div>`;
  if(has&&(m.b.joint||0)>0) h+=`<div class="note">באזור יש רשימה משותפת של יהדות התורה וש"ס ב-2024, ולכן ההשוואה הנכונה היא בשורה "יהדות התורה + ש"ס".</div>`;
  if(has&&(m.b.utj||0)>0) h+=`<div class="note">דגל ואגודה רצו באזור גם ברשימה משותפת, שאין לפצל.</div>`;
  if(y6.n&&!has) h+=`<div class="note">אין נתוני 2024 לאזור הזה.</div>`;
  if(has&&y6.e&&m.e<y6.e*.93) h+=`<div class="note">נתוני 2024 קיימים רק ברשויות שיש להן קובץ תוצאות למועצה, ולכן השינוי מ-2024 באזור הזה מקורב בלבד.</div>`;
  return h; }

function withTiers(list,fn){ const keep=S.tiers; S.tiers={[CERT]:false,[NEAR]:false,[GUESS]:false,[NONE]:false}; list.forEach(t=>S.tiers[t]=true); try{ return fn(); }finally{ S.tiers=keep; } }
/* ---------- מעוזים ---------- */
const CITYBOTH={};
function cityBoth(c){ if(c in CITYBOTH) return CITYBOTH[c]; let d=0,a=0; ROWS.forEach(r=>{ if(r.code===c&&r.m){ d+=r.m.b.dagel||0; a+=r.m.b.aguda||0; } }); return CITYBOTH[c]=d>0&&a>0; }
const dshare=r=>{ const d=r.m.b.dagel||0,a=r.m.b.aguda||0; return d/(d+a); };
function sgCompute(rows){ const th=S.th/100, G={dagel:[],aguda:[],mixed:[]}; let skipJoint=0,skipOne=0,skipSmall=0;
  rows.forEach(r=>{ if(r.kind!=='place'||!inTier(r)||!r.m||!r.y26.e||!r.y22.e||!r.m.e) return; const b=r.m.b; if((b.utj||0)>0||(b.joint||0)>0){ skipJoint++; return; } if(!cityBoth(r.code)){ if((b.dagel||0)+(b.aguda||0)>0) skipOne++; return; } if((b.dagel||0)+(b.aguda||0)<100){ skipSmall++; return; } const s=dshare(r); (s>=th?G.dagel:s<=1-th?G.aguda:G.mixed).push(r); });
  return {G,skipJoint,skipOne,skipSmall}; }
function sgAgg(l){ const a={n:l.length,e26:0,e22:0,e24:0,g22:0,g26:0,d:0,a:0,s22:0,s26:0,k26:0,k22:0}; l.forEach(r=>{ a.e26+=r.y26.e; a.e22+=r.y22.e; a.e24+=r.m.e; a.g22+=r.y22.votes['ג']||0; a.g26+=r.y26.votes['ג']||0; a.d+=r.m.b.dagel||0; a.a+=r.m.b.aguda||0; a.s22+=r.y22.votes['שס']||0; a.s26+=r.y26.votes['שס']||0; }); a.p22=div(a.g22,a.e22); a.p26=div(a.g26,a.e26); a.p24=div(a.d+a.a,a.e24); a.r22=rel(a.p26,a.p22); a.r24=rel(a.p26,a.p24); return a; }
function sgRow(lbl,a,key,tot){ const dc=(r,pts)=>`<td class="n"><b class="${cls(r)}">${r==null?'—':sgn(r)+'%'}</b><span class="s">${pts}</span></td>`;

const POOL=[{id:'ג',t:'יהדות התורה',k:['ג'],k22:['ג']},{id:'שס',t:'ש"ס',k:['שס'],k22:['שס']},{id:'right',t:'עוצמה + הציונות הדתית',k:['ב','ט'],k22:['ט']},{id:'ב',t:'· מתוכן עוצמה יהודית',k:['ב'],k22:null,only:1},{id:'ט',t:'· מתוכן הציונות הדתית',k:['ט'],k22:null,only:1},{id:'נר',t:'צבע שחור',k:['נר'],k22:[]},{id:'זך',t:'הציבור החרדי',k:['זך'],k22:[]}];
function flowCalc(rows){ const pts=rows.filter(r=>inTier(r)&&(r.kind==='place'||r.kind==='whole')&&r.tier!==NONE&&r.y22.e&&r.y26.e&&r.y22.k>=50&&r.y26.k>=50&&(lv(r.y22.votes,['ג','שס'])/r.y22.k)>=.3);

  const P=POOL.filter(p=>!p.only); const agg_=(f)=>pts.reduce((a,r)=>a+f(r),0); const e26=agg_(r=>r.y26.e),e22=agg_(r=>r.y22.e);
  const acc=P.map(p=>{ const v6=agg_(r=>lv(r.y26.votes,p.k)),v2=agg_(r=>lv(r.y22.votes,p.k22)),p6=div(v6,e26),p2=div(v2,e22); return {...p,v6,v2,p6,p2,pts:(p6!=null&&p2!=null)?(p6-p2)*100:null}; });

  return {pts,acc,t2,t6,src,reg,e26}; }

/* ---------- צבע שחור מול עץ ---------- */
function corr(x,y){ if(x.length<5) return null; const ax=x.reduce((a,b)=>a+b,0)/x.length,ay=y.reduce((a,b)=>a+b,0)/y.length; let a=0,b=0,c=0; x.forEach((v,i)=>{ a+=(v-ax)*(y[i]-ay); b+=(v-ax)**2; c+=(y[i]-ay)**2; }); return (b&&c)?a/Math.sqrt(b*c):null; }
function nerCalc(rows){ const hk=r=>lv(r.y26.votes,['ג','שס','נר','זך']), hm=r=>Object.values(r.m.b).reduce((a,b)=>a+b,0);

    codes.map(cd=>{ const q=rows.filter(r=>r.code===cd); const n=nerCalc(q); return {name:q[0].city,...n}; }).sort((a,b)=>b.peleg-a.peleg).forEach(x=>{ h+=`<tr><td class="name">${esc(x.name)}</td><td class="n">${fmt(x.peleg)}</td><td class="n">${fmt(x.ner)}</td><td class="n">${pc(x.ratio,0)}</td><td class="n">${x.r==null?'—':x.r.toFixed(2)}</td><td class="n">${x.Q.length}</td></tr>`; }); h+=`</table></div>`; }

function partyLine(t,A,k,k22,m){ const y6=A.y26,y2=A.y22; const v6=lv(y6.votes,k),v2=lv(y2.votes,k22),p6=div(v6,y6.e),p2=div(v2,y2.e),r=rel(p6,p2); let s=`${t} קיבלה ${fmt(v6)} קולות, ${pc(p6)} מהבז"ב ו-${pc(div(v6,y6.k))} מהכשרים. `; if(y2.e) s+=`ב-2022 היא קיבלה ${fmt(v2)} קולות, ${pc(p2)} מהבז"ב. מספר הקולות ${upd(v6-v2,'עלה','ירד')} ב-${fmt(Math.abs(v6-v2))}, ${r!=null?`והאחוז מהבז"ב ${upd(r,'עלה','ירד')} ב-${Math.abs(r).toFixed(1)}% (${sgn((p6-p2)*100)} נקודות).`:''}`; return s; }
function buildReport(rows,title){ const A=agg(rows),y6=A.y26,y2=A.y22,m=A.m; const codes=[...new Set(rows.map(r=>r.code))].filter(c=>c!=='9999'); const single=codes.length===1; const o=[];

  else if(sub==='flow') h+=flowSection(rows);
  else if(sub==='ner') h+=nerSection(rows)||`<div class="card"><h2>צבע שחור ועץ</h2><p class="sub">עץ לא רצה באזור הזה ב-2024. צבע שחור קיבל ${fmt(A.y26.votes['נר']||0)} קולות, והציבור החרדי ${fmt(A.y26.votes['זך']||0)} קולות.</p></div>`;
  else { if(opts.code) h+=nbSection(rows,opts.code); h+=citySection(rows); h+=await clusterSection(rows); }
  return h; }
function labelTables(root){ (root||document).querySelectorAll('table').forEach(t=>{ const hr=[...t.rows].find(r=>r.querySelector(':scope>th')); if(!hr) return; hr.classList.add('hrow'); const L=[...hr.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()); [...t.rows].forEach(r=>{ if(r===hr) return; [...r.cells].forEach((c,i)=>{ if(c.colSpan===1&&!c.classList.contains('name')&&L[i]) c.dataset.l=L[i]; }); }); }); }
/* ---------- מסכים ---------- */
function citiesOpts(){ return Object.values(CITIES).sort((a,b)=>a.name.localeCompare(b.name,'he')).map(c=>`<option value="${esc(c.name)} (${c.code})">`).join(''); }
function header(k,t){ return `<div class="nav noprint"><div class="seg2">${[['over','סקירה כללית'],['an','ניתוח'],['map','מפה']].map(([v,l])=>`<button data-tab="${v}" class="${S.tab===v?'on':''}">${l}</button>`).join('')}</div></div><div class="hd noprint"><div class="k">${esc(k)}</div><h1>${esc(t)}</h1></div>`; }
const tierText=()=>allOn()?'כל הרמות':TIERS.filter(t=>S.tiers[t]).join(', ')||'לא נבחרה רמה';
function bar(sum,ctl){ return `<div class="bar noprint"><div class="sum">${sum} <span>· ודאות: ${esc(tierText())}</span></div><button class="btn" data-a="ctl">${CTL?'סגירה':'שינוי'}</button></div>${CTL?`<div class="ctl noprint">${ctl}</div>`:''}`; }
function concCard(){ const concAll=ROWS.filter(r=>CONC.includes(r.code)),nat=agg(ROWS),c=agg(concAll); const u6=c.y26.votes['ג']||0,u2=c.y22.votes['ג']||0,n6=nat.y26.votes['ג']||0,n2=nat.y22.votes['ג']||0;
  return `<div class="card noprint"><h2>20 הריכוזים של יהדות התורה</h2><p class="sub">${fmt(u2)} קולות ב-2022, ${fmt(u6)} ב-2026: ${sgi(u6-u2)} (${sgn(rel(u6,u2))}%). בכל הארץ ${sgi(n6-n2)} (${sgn(rel(n6,n2))}%).</p><button class="btn" data-a="conc">לפתיחת הריכוזים בניתוח</button> <button class="btn" data-a="natan">לניתוח של כל הארץ</button></div>`; }
async function render(){ const app=$('#app'); let h='';
  if(S.tab==='over'){ h=header('בחירות לכנסת 2022 ו-2026, והבחירות המוניציפליות 2024','סקירה כללית')+bar('<b>כל הארץ</b>',tierControls())+buildReport(ROWS,'כל הארץ')+concCard(); }
  else if(S.tab==='an'){ const scope=S.scope; let title,rows,code=null,ctl='';
    ctl+=`<label>אזור</label><div class="seg2" style="width:max-content">${[['nat','כל הארץ'],['cities','ערים'],['dist','מחוז']].map(([v,l])=>`<button data-scope="${v}" class="${scope===v?'on':''}">${l}</button>`).join('')}</div>`;
    if(scope==='cities'){ ctl+=`<label>ערים</label><div><div class="chips" id="cchips">${S.cities.filter(c=>CITIES[c]).map(c=>`<span data-rm="${c}">${esc(CITIES[c].name)} <b>×</b></span>`).join('')||'<span style="border:0;background:transparent;cursor:default;color:var(--ink3)">לא נבחרו ערים</span>'}</div><div style="margin-top:6px"><input type="text" id="cadd" list="locs" placeholder="הוספת עיר: הקלד שם"><datalist id="locs">${citiesOpts()}</datalist> <button class="btn" data-a="conc">20 הריכוזים</button> <button class="btn" data-a="clearc">ניקוי</button></div></div>`; const cs=S.cities.filter(c=>CITIES[c]); rows=ROWS.filter(r=>cs.includes(r.code)); title=cs.length===1?CITIES[cs[0]].name:cs.length?(cs.length+' ערים'):'לא נבחרו ערים'; if(cs.length===1) code=cs[0]; if(!cs.length) CTL=true; }
    else if(scope==='dist'){ const ds=[...new Set(ROWS.map(r=>r.district))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'he')); ctl+=`<label>מחוז</label><div><select data-c="dist">${ds.map(d=>`<option ${d===S.dist?'selected':''}>${esc(d)}</option>`).join('')}</select></div>`; rows=ROWS.filter(r=>r.district===S.dist); title='מחוז '+S.dist; }
    else { rows=ROWS; title='כל הארץ'; }
    if(code){ const names=[...new Set(rows.filter(r=>r.kind==='place').map(nb1))].sort((a,b)=>a.localeCompare(b,'he')); if(names.some(n=>n!=='ללא שכונה')){ const sel=S.nsel[code]||[]; ctl+=`<label>שכונות</label><div class="chips"><span data-nsel="" class="${sel.length?'':'on'}">הכל</span>${names.map(n=>`<span data-nsel="${esc(n)}" class="${sel.includes(n)?'on':''}">${esc(n)}</span>`).join('')}</div>`; if(sel.length){ rows=rows.filter(r=>r.kind==='place'&&sel.includes(nb1(r))); title+=' · '+(sel.length===1?sel[0]:sel.length+' שכונות'); } } }
    ctl+=tierControls();
    h=header('ניתוח לפי בחירה',title)+bar(`<b>${esc(title)}</b>`,ctl);
    h+=rows.length?await results(rows,title,{code:(code&&!(S.nsel[code]||[]).length)?code:null}):`<p class="empty">בחר אזור.</p>`; }
  else { const legend=S.metric==='utj'||S.metric==='shas'?'<i style="background:rgba(164,67,44,.9)"></i>ירידה <i style="background:rgba(19,111,115,.9)"></i>עלייה':S.metric==='dg'?'<i style="background:rgba(180,120,40,.9)"></i>אגודה <i style="background:rgba(19,111,115,.9)"></i>דגל':'<i style="background:rgba(90,75,50,.9)"></i>גבוה יותר'; h=header('סימון שטח על מפה','מפה')+bar('<b>נקודות על המפה</b>',tierControls())+`<div class="tools noprint"><select data-c="metric">${[['utj','יהדות התורה: שינוי באחוז מהבז"ב'],['shas','ש"ס: שינוי באחוז מהבז"ב'],['putj','יהדות התורה: אחוז מהבז"ב 2026'],['pshas','ש"ס: אחוז מהבז"ב 2026'],['ner','צבע שחור: אחוז מהבז"ב 2026'],['dg','חלק דגל מדגל ואגודה 2024']].map(([v,t])=>`<option value="${v}" ${S.metric===v?'selected':''}>${t}</option>`).join('')}</select> <button class="btn ${DRAW?'on':''}" data-a="draw">${DRAW?'מסמן: לחץ על המפה, ובסיום לחץ כאן':'סמן שטח'}</button> <button class="btn" data-a="clearpoly" ${POLY.length?'':'disabled'}>נקה סימון</button> <input type="text" id="jump" list="locs" placeholder="קפיצה ליישוב" style="width:170px"><datalist id="locs">${citiesOpts()}</datalist></div><div class="legendm noprint">${legend} <span><i style="background:#b9b2a2"></i>אין נתון</span> <span>גודל הנקודה: בז"ב</span></div><div id="map"></div><div class="note noprint">ביישובים הגדולים נקודה לכל אשכול, וביישובים הקטנים נקודה ליישוב. המפה נשארת היכן שהיית.</div><div id="mapres" style="margin-top:12px"></div>`; }
  app.innerHTML=h; labelTables(app); if(S.tab==='map'){ mountMap(); await drawRes(); } }

/* ---------- מפה ---------- */
const mapRows=()=>ROWS.filter(r=>inTier(r)&&r.lat&&(r.kind==='place'||r.kind==='whole'));
function metricVal(r){ const p=(y,l)=>div(lv(r[y].votes,l),r[y].e); switch(S.metric){ case 'utj': return rel(p('y26',['ג']),p('y22',['ג'])); case 'shas': return rel(p('y26',['שס']),p('y22',['שס'])); case 'putj': return p('y26',['ג'])*100; case 'pshas': return p('y26',['שס'])*100; case 'ner': return p('y26',['נר'])*100; case 'dg': return r.m&&((r.m.b.dagel||0)+(r.m.b.aguda||0))>=30? dshare(r)*100 : null; } return null; }
function mcolor(v){ if(v==null||isNaN(v)) return '#b9b2a2'; if(S.metric==='utj'||S.metric==='shas'){ const t=Math.max(-1,Math.min(1,v/30)); return t>=0?`rgba(19,111,115,${(.25+.75*t).toFixed(2)})`:`rgba(164,67,44,${(.25+.75*-t).toFixed(2)})`; } if(S.metric==='dg'){ const t=(v-50)/50; return t>=0?`rgba(19,111,115,${(.25+.75*t).toFixed(2)})`:`rgba(180,120,40,${(.25+.75*-t).toFixed(2)})`; } const mx=S.metric==='ner'?6:70; const t=Math.min(1,v/mx); return `rgba(90,75,50,${(.15+.85*t).toFixed(2)})`; }
function inPoly(p,q){ let c=false; for(let i=0,j=q.length-1;i<q.length;j=i++){ const [yi,xi]=q[i],[yj,xj]=q[j]; if(((yi>p[0])!==(yj>p[0]))&&(p[1]<(xj-xi)*(p[0]-yi)/(yj-yi)+xi)) c=!c; } return c; }
function mountMap(){ try{ if(MAP){ const c0=MAP.getCenter(); S.mapView={lat:+c0.lat.toFixed(5),lng:+c0.lng.toFixed(5),z:MAP.getZoom()}; const rr=MAP._renderer; if(rr&&rr._redrawRequest){ L.Util.cancelAnimFrame(rr._redrawRequest); rr._redrawRequest=null; } MAP.remove(); } }catch(e){} POLYL=null;
  MAP=L.map('map',{preferCanvas:true}); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP); const v=S.mapView; if(v) MAP.setView([v.lat,v.lng],v.z); else MAP.setView([31.75,34.95],8);
  const list=mapRows(),mx=Math.max(1,...list.map(r=>r.y26.e));
  list.forEach(r=>{ const val=metricVal(r); const m=L.circleMarker([r.lat,r.lon],{radius:2.5+10*Math.sqrt(r.y26.e/mx),color:'#2a2722',weight:.5,fillColor:mcolor(val),fillOpacity:1}).addTo(MAP); m.on('popupopen',()=>{ if(DRAW) m.closePopup(); }); m.bindPopup(()=>{ const p=(y,l)=>div(lv(r[y].votes,l),r[y].e); return `<b>${esc(r.city)} · ${esc(rowName(r))}</b>${tierTag(r)}<br>${esc(r.addr||'')}${r.nbhd?' · '+esc(r.nbhd):''}<br>בז"ב ${fmt(r.y26.e)} · הצבעה ${pc(div(r.y26.v,r.y26.e))}<br>יהדות התורה ${pc(p('y26',['ג']))} (2022: ${pc(p('y22',['ג']))})<br>ש"ס ${pc(p('y26',['שס']))} (2022: ${pc(p('y22',['שס']))})${r.m?`<br>2024: דגל ${fmt(r.m.b.dagel||0)}, אגודה ${fmt(r.m.b.aguda||0)}, ש"ס ${fmt(r.m.b.shas||0)}, עץ ${fmt(r.m.b.peleg||0)}`:''}`; }); });
  const keep=()=>{ const c=MAP.getCenter(); S.mapView={lat:+c.lat.toFixed(5),lng:+c.lng.toFixed(5),z:MAP.getZoom()}; save(); }; MAP.on('moveend dragend zoomend',keep); keep();
  MAP.on('click',e=>{ if(!DRAW) return; POLY.push([e.latlng.lat,e.latlng.lng]); drawPoly(); drawRes(); }); $('#map').style.cursor=DRAW?'crosshair':''; drawPoly(); }
function drawPoly(){ if(POLYL){ MAP.removeLayer(POLYL); POLYL=null; } if(POLY.length) POLYL=(POLY.length>=3?L.polygon(POLY,{color:'#8c3a2b',weight:2,fillOpacity:.08}):L.polyline(POLY,{color:'#8c3a2b',weight:2,dashArray:'4 4'})).addTo(MAP); const c=document.querySelector('[data-a="clearpoly"]'); if(c) c.disabled=!POLY.length; }
async function drawRes(){ const el=$('#mapres'); if(!el) return; if(POLY.length<3){ el.innerHTML=`<p class="empty">סמן שטח על המפה כדי לראות את התוצאות שלו: "סמן שטח", לחיצות סביב האזור, וסיום בלחיצה נוספת על הכפתור.</p>`; return; } const sel=ROWS.filter(r=>r.lat&&(r.kind==='place'||r.kind==='whole')&&inPoly([r.lat,r.lon],POLY)); el.innerHTML=sel.length?await results(sel,`השטח המסומן (${sel.length} נקודות)`):`<p class="empty">אין נקודות בשטח המסומן.</p>`; labelTables(el); }

/* ---------- אירועים ---------- */
document.addEventListener('click',async ev=>{ const t=ev.target; const tab=t.closest('[data-tab]'); if(tab){ S.tab=tab.dataset.tab; OPEN.clear(); FIND=''; CTL=false; save(); return render(); }
  const su=t.closest('[data-sub]'); if(su){ S.sub=su.dataset.sub; save(); return S.tab==='map'?drawRes():render(); }
  const sc=t.closest('[data-scope]'); if(sc){ S.scope=sc.dataset.scope; OPEN.clear(); FIND=''; save(); return render(); }
  const rm=t.closest('[data-rm]'); if(rm){ S.cities=S.cities.filter(c=>c!==rm.dataset.rm); save(); return render(); }
  const ns=t.closest('[data-nsel]'); if(ns){ const code=S.cities.find(c=>CITIES[c]); const n=ns.dataset.nsel; let cur=S.nsel[code]||[]; cur=!n?[]:cur.includes(n)?cur.filter(x=>x!==n):[...cur,n]; S.nsel[code]=cur; OPEN.clear(); save(); return render(); }
  const nb=t.closest('tr[data-nb]'); if(nb){ const code=S.cities.find(c=>CITIES[c]); S.nsel[code]=[nb.dataset.nb]; OPEN.clear(); FIND=''; S.sub='report'; save(); render(); window.scrollTo(0,0); return; }
  const ct=t.closest('tr[data-city]'); if(ct){ S.tab='an'; S.scope='cities'; S.cities=[ct.dataset.city]; OPEN.clear(); FIND=''; save(); render(); window.scrollTo(0,0); return; }
  const op=t.closest('tr[data-open]'); if(op&&!t.closest('select')){ const k=op.dataset.open; OPEN.has(k)?OPEN.delete(k):OPEN.add(k); return S.tab==='map'?drawRes():render(); }
  const a=t.closest('[data-a]'); if(!a) return; const act=a.dataset.a;
  if(act==='ctl'){ CTL=!CTL; return S.tab==='map'?render():render(); }
  if(act==='print'){ const rp=$('#report'); if(!rp) return; $('#printarea').innerHTML=rp.outerHTML; document.body.classList.add('rp'); const tt=document.title; document.title='ניתוח בחירות - '+(rp.querySelector('h2')?.innerText||''); window.print(); document.title=tt; document.body.classList.remove('rp'); return; }
  if(act==='natan'){ S.tab='an'; S.scope='nat'; S.sub='cmp'; OPEN.clear(); save(); render(); window.scrollTo(0,0); return; }
  if(act==='csv'){ const s='﻿'+CSV.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'); const l=document.createElement('a'); l.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'})); l.download='kalpiot_clusters.csv'; l.click(); return; }
  if(act==='conc'){ S.tab='an'; S.scope='cities'; S.cities=[...CONC]; S.sub=S.sub==='report'?'cmp':S.sub; OPEN.clear(); FIND=''; save(); render(); window.scrollTo(0,0); return; }
  if(act==='clearc'){ S.cities=[]; save(); return render(); }
  if(act==='draw'){ DRAW=!DRAW; if(!DRAW&&POLY.length<3) POLY=[]; a.classList.toggle('on',DRAW); a.textContent=DRAW?'מסמן: לחץ על המפה, ובסיום לחץ כאן':'סמן שטח'; $('#map').style.cursor=DRAW?'crosshair':''; drawPoly(); return drawRes(); }
  if(act==='clearpoly'){ POLY=[]; DRAW=false; const d=document.querySelector('[data-a="draw"]'); if(d){ d.classList.remove('on'); d.textContent='סמן שטח'; } $('#map').style.cursor=''; drawPoly(); return drawRes(); }
});
document.addEventListener('change',ev=>{ const t=ev.target; if(t.dataset.tier){ S.tiers[t.dataset.tier]=t.checked; save(); return render(); }
  if(t.dataset.c==='th'){ S.th=+t.value; save(); return S.tab==='map'?drawRes():render(); } if(t.dataset.c==='dist'){ S.dist=t.value; OPEN.clear(); save(); return render(); } if(t.dataset.c==='metric'){ S.metric=t.value; save(); return render(); } if(t.dataset.c==='flowsrc'){ FLOWSRC=t.value; return S.tab==='map'?drawRes():render(); } if(t.dataset.c==='find'){ FIND=t.value; return S.tab==='map'?drawRes():render(); }
  const pick=v=>{ const m=/\((\d+)\)\s*$/.exec(v); if(m&&CITIES[m[1]]) return m[1]; const c=Object.values(CITIES).find(x=>x.name===v.trim()); return c&&c.code; };
  if(t.id==='cadd'){ const c=pick(t.value); if(c&&!S.cities.includes(c)){ S.cities=[...S.cities,c]; OPEN.clear(); save(); render(); } return; }
  if(t.id==='jump'){ const c=pick(t.value); if(c&&MAP){ const ps=ROWS.filter(r=>r.code===c&&r.lat); if(ps.length) MAP.fitBounds(ps.map(r=>[r.lat,r.lon]),{padding:[30,30],maxZoom:15}); t.value=''; } } });
fetchJSON('live/base_table.json').then(d=>{ ROWS=d; ROWS.forEach(r=>{ if(r.code==='9999') return; if(!CITIES[r.code]) CITIES[r.code]={code:r.code,name:r.city}; }); return render(); }).catch(e=>{ $('#app').innerHTML='<p class="empty">שגיאה בטעינת הנתונים: '+esc(e.message)+'</p>'; });
</script>
</body>
