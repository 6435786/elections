<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בחירות לכנסת ה-26 – תמונת מצב ארצית</title>
<style>
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Heebo";font-weight:100 900;font-display:swap;src:url(fonts/heebo-latin.woff2) format("woff2")}
@font-face{font-family:"Petek";font-weight:900;font-display:swap;src:url(fonts/petek-hebrew.woff2) format("woff2")}
:root{--bg:#f3eee4;--card:#fffdf8;--line:#e2d9c6;--line2:#cfc4aa;--ink:#2a2722;--ink2:#67604f;--ink3:#9a917c;--acc:#136f73;--acc-soft:#e3efee;--up:#2c7a4b;--down:#a4432c;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 60px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.tabs{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--card)}
.tabs a{padding:7px 16px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}
.tabs a.on{background:var(--ink);color:#fff}
.nav .more{font-size:13px;color:var(--ink3);text-decoration:none}
.hd{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.hd .k{font-size:13px;color:var(--ink2)}
.hd h1{font-family:"Petek","Heebo",serif;font-weight:900;font-size:38px;line-height:1.05;margin:2px 0 4px;letter-spacing:.01em}
.hd .big{text-align:left}
.hd .big .v{font-size:40px;font-weight:800;line-height:1;color:var(--acc)}
.hd .big .l{font-size:12.5px;color:var(--ink2)}
.prog{height:10px;border-radius:5px;background:#e6dfd0;overflow:hidden;display:flex;direction:rtl;margin:8px 0 4px}
.prog span{height:100%}
.hatch{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)}
.srcs{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink2)}
.srcs b{color:var(--ink);font-weight:700}
.srcs i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-start:5px;vertical-align:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:14px 0}
.card h2{font-family:"Petek","Heebo",serif;font-weight:900;font-size:24px;margin:0 0 2px;line-height:1.1}
.card .sub{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* חצי-טבעת */
.ring{position:relative}
.ring .c{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);text-align:center;line-height:1}
.ring .c .v{font-size:38px;font-weight:800}
.ring .c .l{font-size:11.5px;color:var(--ink2);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 8px 3px 6px;font-size:12.5px;background:#fff}
.chip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chip b{font-weight:700}
/* גושים */
.bbar{position:relative;height:22px;border-radius:5px;overflow:visible;display:flex;direction:rtl;background:#e6dfd0;margin:14px 0 18px}
.bbar span{height:100%}
.bbar span:first-child{border-radius:0 5px 5px 0}
.bbar .maj{position:absolute;top:-6px;height:34px;border-right:2px solid var(--ink);width:0}
.bbar .maj:after{content:'61';position:absolute;bottom:-17px;right:-8px;font-size:11px;color:var(--ink2)}
/* כרטיסי מפלגות */
.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.party{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center}
.slip{width:36px;height:50px;padding:2px;background:#fcfcf8;border:1px solid #c9c5b8;box-shadow:1px 2px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;grid-row:1/3;transform:rotate(-4deg)}
.slip b{font-family:"Petek","FrankRuehl",serif;font-weight:900;line-height:1;font-size:22px}
.slip.n3 b{font-size:16px}.slip.n2 b{font-size:20px}
.party .name{font-size:19px;font-weight:800;line-height:1.15}
.party .now{font-size:12.5px;color:var(--ink2)}
.party .now b{color:var(--up)} .party .now b.d{color:var(--down)}
.party .seats{font-size:40px;font-weight:900;line-height:1;grid-row:1/3;color:var(--pc)}
.party .sb{grid-column:1/4;height:10px;border-radius:5px;background:#eee8da;overflow:hidden;display:flex;direction:rtl;margin:8px 0 8px}
.party .sb span{height:100%}
.party .kv{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.party .kv div{display:flex;justify-content:space-between;gap:6px}
.party .kv .k{color:var(--ink2)} .party .kv .v{font-weight:600}
/* טבלאות */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;color:var(--ink2);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:bottom}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mute{color:var(--ink3)}
tr.tot td{font-weight:700;background:#faf6ec}
.up{color:var(--up);font-weight:600} .down{color:var(--down);font-weight:600}
.tw{overflow-x:auto}
h3{font-size:14px;font-weight:700;margin:14px 0 4px;color:var(--ink2)}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:12px 0}
summary{cursor:pointer;padding:12px 18px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{font-weight:400;color:var(--ink3);font-size:13px;text-align:left}
summary::after{content:'‹';color:var(--ink3);font-size:20px;transition:.15s}
details[open] summary::after{transform:rotate(-90deg)}
details .body{padding:0 18px 16px;font-size:14px;color:var(--ink2)}
details .body p{margin:6px 0}
/* חסימה */
.thr{display:grid;grid-template-columns:1fr 150px auto;gap:6px 12px;align-items:center;font-size:13.5px}
.thr .t{height:12px;background:#eee8da;border-radius:3px;position:relative}
.thr .t span{position:absolute;right:0;top:0;height:100%;border-radius:3px}
.thr .t:after{content:'';position:absolute;right:calc(100% * 3.25/4.5);top:-4px;height:20px;border-right:2px dashed var(--down)}
.thr .lab{grid-column:2;font-size:11.5px;color:var(--down);text-align:right;padding-right:calc(100% * 3.25/4.5 - 36px)}
.note{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.empty{color:var(--ink2);padding:24px 0;text-align:center}
@media (max-width:640px){ .hd{grid-template-columns:1fr} .hd .big{text-align:right} .hd h1{font-size:31px} .two,.parties{grid-template-columns:1fr} .party .seats{font-size:34px} td,th{padding:6px 4px;font-size:13px} .wrap{padding:10px 10px 50px} }
@media print{ body{background:#fff} .nav{display:none} .card,.party,details{break-inside:avoid} }
</style>

<body>
<div class="wrap" id="app"><p class="empty">טוען נתונים…</p></div>
<script>
'use strict';
const LISTS=[
  {id:'likud',   name:'הליכוד',             letter:'מחל', bloc:'right',  color:'#8c3a2b'},
  {id:'rzd',     name:'הציונות הדתית',      letter:'ט',   bloc:'right',  color:'#b85c3a'},
  {id:'otzma',   name:'עוצמה יהודית',        letter:'ב',   bloc:'right',  color:'#d2865a'},
  {id:'amcha',   name:'עמך ישראל',           letter:'ך',   bloc:'right',  color:'#e2b48c'},
  {id:'shas',    name:'ש"ס',                 letter:'שס',  bloc:'haredi', color:'#4a3b2a'},
  {id:'utj',     name:'יהדות התורה',         letter:'ג',   bloc:'haredi', color:'#7d6448'},
  {id:'yashar',  name:'ישר!',                letter:'דרך', bloc:'left',   color:'#136f73'},
  {id:'beyachad',name:'ביחד',                letter:'רק',  bloc:'left',   color:'#2f9e8f'},
  {id:'dem',     name:'הדמוקרטים',           letter:'אמת', bloc:'left',   color:'#63b7a4'},
  {id:'yb',      name:'ישראל ביתנו',         letter:'ל',   bloc:'left',   color:'#1f4f52'},
  {id:'milu',    name:'המילואימניקים',       letter:'די',  bloc:'left',   color:'#a3cfc2'},
  {id:'raam',    name:'רע"ם',                letter:'עם',  bloc:'arab',   color:'#6f7f2e'},
  {id:'joint',   name:'הרשימה המשותפת',      letter:'ודם', bloc:'arab',   color:'#a9a83c'},
];
const PAIRS=[['beyachad','yb'],['yashar','dem'],['likud','rzd'],['raam','joint'],['shas','utj']];
const BLOCS=[['right','ימין'],['haredi','חרדים'],['left','מרכז-שמאל'],['arab','ערבים']];
const BLOC_COLOR={right:'#9c452f',haredi:'#5a4632',left:'#136f73',arab:'#7a8a33'};
const SMALL_NAMES={'ני':'נעם לישראל','זך':'הציבור החרדי','נר':'צבע שחור','כן':'כן','פה':'אני ואתה'};
// אות 2026 → האותיות ב-2022 שמהן באים הקולות (לחישוב מה צפוי ביישובים שטרם נספרו)
const PARENTS={'מחל':['מחל'],'ט':['ט'],'ב':['ט'],'שס':['שס'],'ג':['ג'],'דרך':['פה','כן'],'רק':['פה','כן'],'די':['פה','כן'],'אמת':['אמת','מרצ'],'ל':['ל'],'עם':['עם'],'ודם':['ום','ד']};
const SAME22={'מחל':['מחל'],'ט':['ט'],'שס':['שס'],'ג':['ג'],'אמת':['אמת','מרצ'],'ל':['ל'],'עם':['עם'],'ודם':['ום','ד']}; // השוואה ישירה ל-2022 רק לרשימות שהיו קיימות
const HAREDI=['3780','6100','3797','2610','1309','922','1137','3660'];
const MIXED=['3000','8000','3730','6700','7700','4000','70','7400','6600','7100','2630','9000'];
const CITY_CARDS=['3780','6100','3797','1309','2610','3000'];
const FULL_ELIGIBLE=7331981, K25_ELIGIBLE=6788804, K25_VOTERS=4794593, K25_CLOSE=70.6, THR=0.0325;
const DAY_URL='https://navonyaniv.github.io/election-il-2026/results.json';
const $=s=>document.querySelector(s);
const fmt=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('he-IL');
const fmtK=n=> n>=1e6? (n/1e6).toFixed(2)+'M' : n>=1e3? (n/1e3).toFixed(n>=1e5?0:2)+'K' : fmt(n);
const pc=(v,d=1)=> v==null||isNaN(v)? '—' : (v*100).toFixed(d)+'%';
const sgn=(d,dd=1)=> d==null||isNaN(d)? '—' : (d>=0?'+':'−')+Math.abs(d).toFixed(dd);
const cls=d=> d==null||isNaN(d)? '' : (d>=0?'up':'down');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function fetchJSON(u,tries=2){ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),12000); try{ const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } catch(e){ if(tries>1){ await new Promise(r=>setTimeout(r,800)); return fetchJSON(u,tries-1); } throw e; } finally{ clearTimeout(tm); } }

/* ---------- בדר-עופר (כמו במחשבון) ---------- */
function allocate(votesByLetter){
  const R=LISTS.map(l=>({...l, votes:votesByLetter[l.letter]||0, seats:0, pass:false}));
  const known=new Set(LISTS.map(l=>l.letter));
  const other=Object.entries(votesByLetter).filter(([l])=>!known.has(l)).reduce((a,[,v])=>a+v,0);
  const valid=R.reduce((a,r)=>a+r.votes,0)+other;
  R.forEach(r=>{ r.pass= valid>0 && r.votes*10000>=325*valid; });
  const passing=R.filter(r=>r.pass); const sumPass=passing.reduce((a,r)=>a+r.votes,0);
  const measure=passing.length? Math.floor(sumPass/120) : 0;
  const out={R,valid,other,measure,sumPass,quota:0};
  if(!measure) return out;
  const partner=id=>{ const p=PAIRS.find(p=>p.includes(id)); return p? p.find(x=>x!==id) : null; };
  const used=new Set(), units=[];
  passing.forEach(r=>{ if(used.has(r.id)) return; const p=partner(r.id); const pr=p&&passing.find(x=>x.id===p);
    if(pr && !used.has(p)){ units.push({ids:[r.id,p],votes:r.votes+pr.votes}); used.add(r.id); used.add(p); } else { units.push({ids:[r.id],votes:r.votes}); used.add(r.id); } });
  units.forEach(u=>{ u.seats=Math.floor(u.votes/measure); });
  let remaining=120-units.reduce((a,u)=>a+u.seats,0), k=0;
  while(remaining>0 && k++<200){ const el=units.filter(u=>u.seats<60); if(!el.length) break;
    let best=null; el.forEach(u=>{ if(!best || u.votes*(best.seats+1)>best.votes*(u.seats+1)) best=u; }); best.seats++; remaining--; }
  units.forEach(u=>{ if(u.ids.length===1){ R.find(x=>x.id===u.ids[0]).seats=u.seats; return; }
    const a=R.find(x=>x.id===u.ids[0]), b=R.find(x=>x.id===u.ids[1]); if(!u.seats){a.seats=0;b.seats=0;return;}
    const pm=Math.floor(u.votes/u.seats); let sa=Math.floor(a.votes/pm), sb=Math.floor(b.votes/pm), rem=u.seats-sa-sb;
    while(rem-->0){ if(a.votes*(sb+1)>=b.votes*(sa+1)) sa++; else sb++; } a.seats=sa; b.seats=sb; });
  out.quota= sumPass/120; // "מחיר" מנדט ממוצע – למנדטים מגובים
  return out;
}

/* ---------- תחזית ---------- */
function project(feed, k25, closeT, rem){
  const parties=feed.parties, PI={}; parties.forEach((p,i)=>PI[p]=i);
  const country=feed.country, towns=feed.towns||{}, prog=(feed.progress&&feed.progress.towns)||{};
  const counted={}; parties.forEach((p,i)=>counted[p]=country[4][i]||0);
  const countedValid=country[3], countedVoters=country[1];
  const natShare={}; parties.forEach(p=>natShare[p]=counted[p]/countedValid);
  const s22=(k,P)=>{ if(!k||!k[3]) return null; let s=0; P.forEach(x=>s+=k[4][x]||0); return s/k[3]; };
  // יחס שינוי לכל רשימה: כמה היא מקבלת ביישובים שנספרו לעומת מה ש"ההורים" שלה קיבלו שם ב-2022
  const r={};
  parties.forEach(p=>{ const P=PARENTS[p]; if(!P){ r[p]=null; return; } let num=0,den=0;
    Object.entries(towns).forEach(([code,t])=>{ const k=k25[code]; const s=s22(k,P); if(s==null||!t[3]) return; num+=t[4][PI[p]]||0; den+=s*t[3]; });
    r[p]= den>0? num/den : 1; });
  const turnoutRatio=(closeT/100)/(K25_CLOSE/100);
  const proj={}; parties.forEach(p=>proj[p]=counted[p]);
  let remPartial=0, remZero=0, projVoters=countedVoters, boxVoters=0, boxTowns=0;
  const shareVec=(k)=>{ const v={}; let sum=0; parties.forEach(p=>{ const P=PARENTS[p]; let s; if(P && k){ const b=s22(k,P); s= b==null? natShare[p] : b*r[p]; } else s=natShare[p]; v[p]=Math.max(0,s); sum+=v[p]; }); if(sum>0) parties.forEach(p=>v[p]/=sum); return v; };
  const rem_=rem;
  const codes=new Set(feed.noTowns? [] : [...Object.keys(prog),...Object.keys(k25)]); codes.delete('9999');
  const townInfo={};
  codes.forEach(code=>{ const pg=prog[code]||[0,0,0], t=towns[code], k=k25[code];
    const a=pg[0], b=pg[1]; let e26=pg[2]||0; if(!e26 && k) e26=k[1]*FULL_ELIGIBLE/K25_ELIGIBLE;
    const V=t?t[1]:0, valid=t?t[3]:0;
    const tr22= k&&k[1]? k[2]/k[1] : K25_CLOSE/100; const X=e26*Math.min(0.97, tr22*turnoutRatio);
    let rem=0; if(b>0 && a>=b) rem=0; else if(a===0 || !V) rem=X; else rem=V*(b-a)/a;
    let remValid= rem*(V? valid/V : 0.99), kk=k;
    // רמת קלפי: אם יש לנו את רשימת הקלפיות החסרות ביישוב (ועדכנית לפחות כמו ההזנה) – משתמשים בפרופיל 2022 של הקלפיות האלה
    const RM= rem>0 && rem_ && rem_.towns && rem_.towns[code];
    if(RM && RM.bc>=a && RM.bt>RM.bc){ rem=RM.voters_est; remValid=RM.valid_est; const pv=Object.values(RM.profile||{}).reduce((x,y)=>x+y,0); if(pv>0) kk=['',0,0,pv,RM.profile]; boxVoters+=rem; boxTowns++; }
    if(rem>0){ const sv=shareVec(kk); parties.forEach(p=>proj[p]+=remValid*sv[p]); if(a>0&&V) remPartial+=rem; else remZero+=rem; projVoters+=rem; }
    townInfo[code]={a,b,e26,V,valid,rem,name:(k&&k[0])||code,k,t};
  });
  // מעטפות כפולות: לפי 2022, מוגדל ביחס הקולות הצפויים
  const dbl=k25['9999']; let dblRem=0;
  if(dbl){ const expD=dbl[2]*(FULL_ELIGIBLE*closeT/100)/K25_VOTERS; const ext=feed.external&&feed.external[1]||0; dblRem=Math.max(0,expD-ext);
    const sv=shareVec(dbl); const dv=dblRem*(dbl[3]/dbl[2]); parties.forEach(p=>proj[p]+=dv*sv[p]); projVoters+=dblRem; }
  const projValid=Object.values(proj).reduce((a,b)=>a+b,0);
  return {parties,counted,proj,countedValid,countedVoters,projValid,projVoters,remPartial,remZero,dblRem,r,townInfo,PI,boxVoters,boxTowns};
}


/* ---------- ציורים ---------- */
function arcPath(cx,cy,R,r,a0,a1){ // זוויות ברדיאנים, 0 = ימין, π = שמאל, חצי עליון
  const p=(rad,ang)=>[cx+rad*Math.cos(ang), cy-rad*Math.sin(ang)];
  const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0); const big= (a1-a0)>Math.PI? 1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${big} 0 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${r} ${r} 0 ${big} 1 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
function halfRing(segs){ // segs: [{color, solid, hatched}] מימין לשמאל, סכום 120
  const W=360,H=190,cx=180,cy=182,R=172,r=108; let a=0, g='<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="2.6" height="6" fill="currentColor"/></pattern></defs>';
  segs.forEach(s=>{ [[s.solid,true],[s.hatched,false]].forEach(([n,solid])=>{ if(!n) return; const a1=a+n/120*Math.PI;
      g+= solid? `<path d="${arcPath(cx,cy,R,r,a,a1)}" fill="${s.color}" stroke="#fffdf8" stroke-width="1"/>` : `<path d="${arcPath(cx,cy,R,r,a,a1)}" fill="url(#hp)" stroke="${s.color}" stroke-width="1.2" style="color:${s.color}"/>`; a=a1; }); });
  g+=`<line x1="${cx}" y1="${cy-R-6}" x2="${cx}" y2="${cy-R+4}" stroke="#2a2722" stroke-width="2"/>`; // קו ה-60/60 (אמצע)
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr">${g}</svg>`;
}
const slip=l=>{ const n=l.letter.replace(/["״׳']/g,'').length; return `<span class="slip n${Math.min(3,n)}"><b>${esc(l.letter)}</b></span>`; };

/* ---------- אחוזי הצבעה לפי שעות ---------- */
const HOURS=['10:00','12:00','14:00','16:00','18:00','20:00','22:00'];
const SECTOR_NAMES={general:'כללי (יהודי לא חרדי)', haredi:'חרדים', arab:'ערבים', judea_samaria:'יהודה ושומרון'};
function turnoutCard(T,T26){
  const s26=Object.assign({},(T&&T.k26)||{}), s25=(T&&T.k25)||{};
  (T26&&T26.reports||[]).forEach(r=>{ if(Number.isInteger(r.hour)&&r.hour>=10&&r.hour<=22&&r.national&&r.national.now>0) s26[(r.hour<10?'0':'')+r.hour+':00']=Math.round(r.national.now*1000)/10; });
  if(!Object.keys(s26).length) return '';
  let rows=HOURS.filter(h=>s26[h]!=null||s25[h]!=null).map(h=>{ const a=s26[h],b=s25[h],d=a!=null&&b!=null?a-b:null; return `<tr><td>${h==='22:00'?'סגירה':h}</td><td class="n"><b>${a!=null?a+'%':'—'}</b></td><td class="n">${b!=null?b+'%':'—'}</td><td class="n ${cls(d)}">${d!=null?sgn(d):'—'}</td></tr>`; }).join('');
  const fin=(T&&T.final)||{}; if(fin['2022']) rows+=`<tr class="tot"><td>סופי (כולל מעטפות כפולות)</td><td class="n">—</td><td class="n">${fin['2022']}%</td><td></td></tr>`;
  // מגזרים: המדגם האחרון של votes26
  const rs=(T26&&T26.reports||[]).filter(r=>r.sectors&&r.sectors.length); const last=rs[rs.length-1]; let sect='';
  if(last){ sect=`<h3>לפי מגזר · מדגם קלפיות בסגירה</h3><table class="num"><tr><th>מגזר</th><th class="n">2026</th><th class="n">2022</th><th class="n">הפרש</th></tr>`+
    ['haredi','arab','judea_samaria','general'].map(id=>{ const x=last.sectors.find(s=>s.id===id); if(!x) return ''; const a=x.now*100,b=x.prev*100; return `<tr><td>${SECTOR_NAMES[id]||id}</td><td class="n"><b>${a.toFixed(1)}%</b></td><td class="n">${b.toFixed(1)}%</td><td class="n ${cls(a-b)}">${sgn(a-b)}</td></tr>`; }).join('')+`</table>`; }
  return `<details open><summary>אחוזי הצבעה ביום הבחירות <small>לפי שעות ולפי מגזר, מול 2022</small></summary><div class="body"><div class="two"><div><h3>ארצי · לפי שעת דיווח</h3><table class="num"><tr><th>שעה</th><th class="n">2026</th><th class="n">2022</th><th class="n">הפרש</th></tr>${rows}</table></div><div>${sect}</div></div><div class="note">מקורות: דיווחי ועדת הבחירות לפי שעה; אומדני המגזרים: votes26.com (מדגם קלפיות). 2022: דיווחי הוועדה באותו יום.</div></div></details>`;
}

/* ---------- דף ---------- */
async function main(){
  const [a,b,c,d,e,f]=await Promise.allSettled([fetchJSON(DAY_URL), fetchJSON('live/results.json'), fetchJSON('live/turnout.json'), fetchJSON('live/k25_towns.json'), fetchJSON('live/remaining.json'), fetchJSON('live/turnout26.json')]);
  let feed= a.status==='fulfilled'? a.value : null; const ours= b.status==='fulfilled'? b.value : null; const T= c.status==='fulfilled'? c.value : {}; const k25= d.status==='fulfilled'? d.value : null;
  const REM= e.status==='fulfilled' && e.value && e.value.towns? e.value : null; const T26= f.status==='fulfilled'? f.value : null;
  if(!(feed && Array.isArray(feed.country) && feed.country[1]>0) && ours && ours.status!=='no_data' && ours.voters>0){
    const letters=ours.letters||Object.keys(ours.votes||{});
    feed={parties:letters, country:[ours.eligible||0, ours.voters, ours.invalid||0, ours.valid, letters.map(l=>ours.votes[l]||0)], towns:{}, progress:{towns:{}, country:[ours.kalpi_counted||0, ours.kalpi||0, ours.eligible||0]}, external:[0,0,0,0], stage: ours.status==='final'?'final':'counting', updated_label: ours.asof_label||ours.updated_label, noTowns:true};
  }
  if(!feed || !Array.isArray(feed.country) || feed.country[1]<=0 || !k25){ $('#app').innerHTML='<p class="empty">עדיין אין נתוני ספירה.</p>'; return; }
  const closeT=(T.k26&&T.k26['22:00'])||77.7;
  const M=project(feed,k25,closeT,REM);
  const final= feed.stage==='final';
  const asof= (ours && ours.voters===feed.country[1] && ours.asof_label) || feed.updated_label || '';
  const now=new Date();
  const C=allocate(M.counted), P=allocate(M.proj);
  const byId=id=>LISTS.find(l=>l.id===id);
  const cR=Object.fromEntries(C.R.map(r=>[r.id,r])), pR=Object.fromEntries(P.R.map(r=>[r.id,r]));
  const backed=id=> P.quota? (M.counted[byId(id).letter]||0)/P.quota : 0;
  const countedShare=M.countedVoters/M.projVoters;
  const order=['likud','rzd','otzma','amcha','shas','utj','yashar','beyachad','dem','yb','milu','raam','joint'];
  const solidTotal=order.reduce((s,id)=>s+Math.floor(Math.min(pR[id].seats,backed(id))),0);
  let h='';
  h+=`<div class="nav"><div class="tabs"><a class="on" href="index.html">ארצי</a><a href="regional.html">אזורי</a></div></div>`;
  h+=`<div class="hd"><div><div class="k">בחירות לכנסת ה-26 · 27.10.2026 · ${final?'תוצאות סופיות':'ספירה חלקית'} · נכון ל-<b>${esc(asof)}</b></div><h1>תמונת המצב הארצית</h1>
      <div class="prog">${[[M.countedVoters,''],[M.remPartial,'hatch'],[M.remZero,'hatch'],[M.dblRem,'hatch']].map(([v,k])=>`<span class="${k}" style="width:${(v/M.projVoters*100).toFixed(2)}%;background:${k?'#8fb8b6':'var(--acc)'}"></span>`).join('')}</div>
      <div class="srcs num"><span><i style="background:var(--acc)"></i>נספרו <b>${fmtK(M.countedVoters)}</b></span><span><i class="hatch" style="background:#8fb8b6"></i>יישובים חלקיים <b>${fmtK(M.remPartial)}</b></span><span><i class="hatch" style="background:#8fb8b6"></i>לא דווחו <b>${fmtK(M.remZero)}</b></span><span><i class="hatch" style="background:#8fb8b6"></i>מעטפות כפולות <b>${fmtK(M.dblRem)}</b></span></div></div>
      <div class="big num"><div class="v">${pc(countedShare)}</div><div class="l">מהקולות הצפויים כבר נספרו</div></div></div>`;
  if(feed.noTowns) h+=`<div class="note">כרגע אין גישה לנתוני היישובים, ולכן התחזית כוללת רק את הקולות שנספרו ואומדן למעטפות הכפולות.</div>`;

  /* הכנסת + גושים */
  const segs=order.map(id=>{ const n=pR[id].seats, s=Math.floor(Math.min(n,backed(id))); return {color:byId(id).color, solid:s, hatched:n-s}; });
  const blocSeats=(R)=>{ const o={}; BLOCS.forEach(([b])=>o[b]=0); LISTS.forEach(l=>{ o[l.bloc]+=(R[l.id]?R[l.id].seats:0); }); return o; };
  const bc=blocSeats(cR), bp=blocSeats(pR);
  h+=`<div class="two"><div class="card"><h2>הכנסת הצפויה</h2><div class="sub">צבע מלא – מנדטים שכבר מגובים בקולות שנספרו; מקווקו – תחזית.</div>
      <div class="ring">${halfRing(segs)}<div class="c num"><div class="v">${solidTotal}</div><div class="l">מגובים מתוך 120</div></div></div>
      <div class="chips">${order.filter(id=>pR[id].seats).map(id=>`<span class="chip"><i style="background:${byId(id).color}"></i>${esc(byId(id).name)} <b>${pR[id].seats}</b></span>`).join('')}</div></div>
    <div class="card"><h2>הגושים</h2><div class="sub">מנדטים לפי גוש, עכשיו ובתחזית. הקו מסמן 61.</div>
      <div class="bbar">${BLOCS.map(([b])=>`<span style="width:${bp[b]/1.2}%;background:${BLOC_COLOR[b]}"></span>`).join('')}<span class="maj" style="right:${61/1.2}%"></span></div>
      <table class="num" style="margin-top:14px"><tr><th>גוש</th><th class="n">עכשיו</th><th class="n">תחזית</th></tr>
      ${BLOCS.map(([b,name])=>`<tr><td><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${BLOC_COLOR[b]};margin-inline-end:7px;vertical-align:-1px"></i>${name}</td><td class="n">${bc[b]}</td><td class="n"><b>${bp[b]}</b></td></tr>`).join('')}
      <tr class="tot"><td>ימין + חרדים</td><td class="n">${bc.right+bc.haredi}</td><td class="n">${bp.right+bp.haredi}</td></tr><tr class="tot"><td>מרכז-שמאל + ערבים</td><td class="n">${bc.left+bc.arab}</td><td class="n">${bp.left+bp.arab}</td></tr></table></div></div>`;

  /* כרטיסי מפלגות */
  const inOrder=[...LISTS].filter(l=>pR[l.id].seats>0||cR[l.id].seats>0).sort((x,y)=>pR[y.id].seats-pR[x.id].seats||M.proj[y.letter]-M.proj[x.letter]);
  h+=`<div class="parties">`+inOrder.map(l=>{ const p=pR[l.id],c=cR[l.id],bk=Math.min(p.seats,backed(l.id)),d=p.seats-c.seats; const mx=Math.max(...inOrder.map(x=>pR[x.id].seats));
    return `<div class="party" style="--pc:${l.color}">${slip(l)}<div><div class="name">${esc(l.name)}</div><div class="now num">עכשיו ${c.seats} ${d===0?'· ללא שינוי':`<b class="${d>0?'':'d'}">${d>0?'▲':'▼'} ${Math.abs(d)}</b>`}</div></div><div class="seats num">${p.seats}</div>
      <div class="sb"><span style="width:${(bk/mx*100).toFixed(1)}%;background:${l.color}"></span><span class="hatch" style="width:${((p.seats-bk)/mx*100).toFixed(1)}%;background:${l.color}99"></span></div>
      <div class="kv num"><div><span class="k">קולות שנספרו</span><span class="v">${fmt(M.counted[l.letter])}</span></div><div><span class="k">צפויים</span><span class="v">${fmt(M.proj[l.letter])}</span></div><div><span class="k">אחוז עכשיו</span><span class="v">${pc(M.counted[l.letter]/M.countedValid,2)}</span></div><div><span class="k">צפוי</span><span class="v">${pc(M.proj[l.letter]/M.projValid,2)}</span></div><div style="grid-column:1/3"><span class="k">מגובים בקולות שנספרו</span><span class="v">${bk.toFixed(1)} מנדטים</span></div></div></div>`; }).join('')+`</div>`;

  /* חסימה + קולות שהתבזבזו */
  const below=M.parties.map(p=>({p, l:LISTS.find(l=>l.letter===p), share:M.proj[p]/M.projValid, votes:M.proj[p]})).filter(x=>x.share<THR && (x.share>=0.004 || ['נר','זך','ני'].includes(x.p))).sort((x,y)=>y.share-x.share);
  const wasted={}; BLOCS.forEach(([b])=>wasted[b]=0); M.parties.forEach(p=>{ const l=LISTS.find(x=>x.letter===p); if(l && M.proj[p]/M.projValid<THR) wasted[l.bloc]+=M.proj[p]; else if(['נר','זך'].includes(p)) wasted.haredi+=M.proj[p]; });
  if(below.length){ h+=`<div class="card"><h2>מתחת לאחוז החסימה</h2><div class="sub">לפי התחזית, ביחס לקו 3.25%.</div><div class="thr num"><div></div><div class="lab">קו החסימה 3.25%</div><div></div>
    ${below.map(x=>`<div>${esc(x.l?x.l.name:(SMALL_NAMES[x.p]||x.p))}</div><div class="t"><span style="width:${Math.min(100,x.share/0.045*100).toFixed(1)}%;background:${x.l?x.l.color:'#b9b2a2'}"></span></div><div>${pc(x.share,2)} · ${fmt(x.votes)}</div>`).join('')}</div>
    <div class="note">קולות שצפויים להתבזבז: ${BLOCS.filter(([b])=>wasted[b]>0).map(([b,n])=>`${n} ${fmt(wasted[b])}`).join(' · ')||'—'} · בסך הכול ${fmt(Object.values(wasted).reduce((a,b)=>a+b,0))} (${pc(Object.values(wasted).reduce((a,b)=>a+b,0)/M.projValid)} מהכשרים).</div></div>`; }

  /* שעות */
  h+=turnoutCard(T,T26);

  /* כל המספרים + שיטה */
  h+=`<details><summary>כל המספרים <small>מנדטים ואחוזים עכשיו ובתחזית, לכל הרשימות</small></summary><div class="body tw"><table class="num"><tr><th>רשימה</th><th class="n">עכשיו</th><th class="n">תחזית</th><th class="n">קולות</th><th class="n">% עכשיו</th><th class="n">% צפוי</th></tr>
    ${M.parties.map(p=>({p,l:LISTS.find(l=>l.letter===p)})).sort((x,y)=>M.proj[y.p]-M.proj[x.p]).filter(x=>M.counted[x.p]>0).map(({p,l})=>`<tr><td>${esc(l?l.name:(SMALL_NAMES[p]||''))} <span style="color:var(--ink3)">${esc(p)}</span></td><td class="n">${l?cR[l.id].seats:0}</td><td class="n"><b>${l?pR[l.id].seats:0}</b></td><td class="n">${fmt(M.counted[p])}</td><td class="n">${pc(M.counted[p]/M.countedValid,2)}</td><td class="n">${pc(M.proj[p]/M.projValid,2)}</td></tr>`).join('')}</table>
    <div class="note">מודד עכשיו: ${fmt(C.measure)} · בתחזית: ${fmt(P.measure)} · כשרים שנספרו: ${fmt(M.countedValid)} · צפויים: ${fmt(M.projValid)} · פסולים: ${fmt(feed.country[2])}</div></div></details>`;
  h+=`<details><summary>איך מחושבת התחזית</summary><div class="body">
    <p>1. <b>יישובים שנספרו במלואם</b> – התוצאה כפי שהיא.</p>
    <p>2. <b>יישובים שדווחו בחלקם</b> – מקובץ הקלפיות של הוועדה יודעים בדיוק אילו קלפיות חסרות. לכל אחת מחפשים את אותה קלפי ב-2022 (אותו יישוב ומספר, בז"ב דומה) ומשתמשים בתוצאה שלה; לקלפי חדשה או שהשתנתה – ממוצע היישוב ב-2022. מספר המצביעים = הבז"ב של הקלפי כפול אחוז ההצבעה שנמדד בקלפיות היישוב שכבר נספרו. הקולות מתוקנים לפי השינוי הארצי של כל רשימה (כמה היא מקבלת ביישובים שכבר נספרו לעומת מה שקיבלו שם ב-2022 הרשימות שמהן היא באה).${M.boxVoters?` כרגע כ-${fmtK(M.boxVoters)} קולות ב-${M.boxTowns} יישובים מוערכים כך (${REM.boxes_matched} קלפיות תואמות, ${REM.boxes_unmatched} לפי ממוצע; נכון ל-${esc(REM.asof_label||'')}).`:''}</p>
    <p>3. <b>יישובים שטרם דווחו</b> – המצביעים הצפויים לפי בעלי זכות הבחירה ואחוז ההצבעה של היישוב ב-2022, מותאם לאחוז ההצבעה הארצי בסגירה (${closeT}% לעומת ${K25_CLOSE}% ב-2022); חלוקת הקולות כמו בסעיף 2.</p>
    <p>4. <b>מעטפות כפולות</b> – לפי מספרן ב-2022 (${fmt(k25['9999'][2])}) מוגדל ביחס לקולות הצפויים, והחלוקה לפי תוצאות המעטפות הכפולות ב-2022 עם השינוי הארצי.</p>
    <p>המנדטים מחושבים בשיטת בדר-עופר עם הסכמי העודפים (${PAIRS.map(p=>byId(p[0]).name+'–'+byId(p[1]).name).join(', ')}). "מגובים" = הקולות שכבר נספרו חלקי מחיר המנדט הצפוי.</p>
    <p>מקורות: ועדת הבחירות המרכזית – תוצאות לפי יישובים ולפי קלפיות (דרך ההזנה הפתוחה election-il-2026 ואתר המיפוי הממשלתי), תוצאות הכנסת ה-25 לפי יישובים וקלפיות.</p></div></details>`;
  h+=`<div class="note">הופק ${now.toLocaleDateString('he-IL')} ${now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})} · הדף מתעדכן לבד כל 2 דקות · התחזית היא הערכה ומשתנה ככל שהספירה מתקדמת.</div>`;
  $('#app').innerHTML=h;
}
function run(){ main().catch(e=>{ $('#app').innerHTML='<p class="empty">שגיאה בטעינת הנתונים: '+esc(e.message)+'</p>'; console.error(e); }); }
run(); setInterval(run,120000);
</script>
