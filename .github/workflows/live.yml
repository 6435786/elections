name: Live results

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Download and summarize the CEC results file
        run: python3 scripts/fetch_results.py --out live/results.json
      - name: Commit if changed
        run: |
          git config user.name "live-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/results.json live/turnout.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Live update $(TZ=Asia/Jerusalem date +%H:%M)"
            git pull --rebase origin main || git rebase --abort
            git push
          fi
